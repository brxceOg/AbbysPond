function rollMenu(c){header('A NEW LITTLE FRIEND','Find a duck');let w=weights();c.innerHTML='<p class="intro">Every duck in the pond has a place on the wheel. Take a breath, give it a spin, and see which little friend finds you. Your luck upgrades still determine the real odds.</p><div class="card"><div class="mtitle">Your collection journey</div><div class="track"><span style="width:'+s.found.length/ducks.length*100+'%"></span></div><div class="meta">'+s.found.length+' / '+ducks.length+' unique ducks discovered</div></div><div class="wheel-card"><div class="wheel-wrap"><canvas id="duck-wheel" role="img" aria-label="Prize wheel showing every possible duck; the pointer marks the result" width="640" height="640"></canvas></div><div class="wheel-result" id="wheel-result">'+(rolling?'The wheel is spinning…':wheelOutcome?wheelResultText(wheelOutcome):'Who will waddle into your pond next? ♡')+'</div><div style="margin-top:11px">'+btn(rolling?'Spinning…':(wheelOutcome?'Invite another duck · ':'Spin for a duck · ')+fmt(rollCost())+' pennies','roll',rolling||s.money<rollCost())+'</div><p class="wheel-note">The wheel’s slices reflect each duck’s actual chance. Luck upgrades change the odds; the animation never changes the result.</p></div><p class="section">CURRENT RARITY ODDS</p><div class="wheel-odds">'+rarities.map(r=>'<div class="setting"><span class="pill '+r+'">'+r+'</span><strong>'+(w[r]*100).toFixed(w[r]<.01?2:1)+'%</strong></div>').join('')+'</div><p class="intro" style="margin-top:12px">Luck level '+s.up.luck+' · familiar friends bring a keepsake petal and a few bonus pennies.</p>';drawWheelElement();}

function flockMenu(c){header('EVERY DUCK IS SPECIAL','Your flock');if(!selected||!s.ducks.some(d=>d.uid===selected))selected=s.ducks[0].uid;let d=s.ducks.find(x=>x.uid===selected),v=def(d),uc=Math.floor(20*Math.pow(1.65,d.level-1)*v.i);c.innerHTML='<p class="intro">Choose a duck to see their strengths, improve their skills, and equip a keepsake.</p><label class="section" for="duck-select">CHOOSE YOUR DUCK</label><select class="select" id="duck-select">'+s.ducks.map(x=>'<option value="'+x.uid+'" '+(x.uid===d.uid?'selected':'')+'>'+def(x).name+' · Lv '+x.level+'</option>').join('')+'</select><div class="card"><div class="row"><div class="avatar">'+v.e+'</div><div class="main"><div class="mtitle">'+v.name+' <span class="pill '+v.r+'">'+v.r+'</span></div><div class="desc">'+v.desc+'</div><div class="meta">Level '+d.level+' · '+fmt(incomeDuck(d))+' pennies/sec</div></div></div><div class="setting"><span>Bravery</span><strong>'+(v.a+(d.level-1)*2)+' power</strong></div><div class="setting"><span>Resilience</span><strong>'+(v.h+(d.level-1)*4)+' health</strong></div><div style="margin-top:12px">'+btn('Care for '+v.name+' · '+fmt(uc), 'duckup:'+d.uid,s.money<uc||d.level>=50)+'</div></div><p class="section">KEEPSAKE SLOTS</p><p class="intro">Swap keepsakes any time without losing them.</p>'+['Charm','Ribbon','Shell'].map(slot=>{let equipped=item(d.equipment[slot]),available=items.filter(x=>x.s===slot&&(s.inv[x.id]||0)>0);return '<div class="card"><div class="row"><div class="main"><div class="mtitle">'+slot+'</div><div class="desc">'+(equipped?equipped.e+' '+equipped.n+' · '+equipped.d:'Nothing tucked in here yet.')+'</div></div>'+(equipped?btn('Remove','off:'+d.uid+':'+slot,false,true):'')+'</div>'+(available.length&&!equipped?'<select class="select" data-slot="'+slot+'" data-duck="'+d.uid+'"><option value="">Choose a keepsake…</option>'+available.map(x=>'<option value="'+x.id+'">'+x.n+' · '+x.d+' ('+s.inv[x.id]+')</option>').join('')+'</select>':'')+'</div>'}).join('')}
function inventoryMenu(c){header('LITTLE TREASURES','Keepsakes');let got=items.filter(x=>(s.inv[x.id]||0)>0);c.innerHTML='<p class="intro">A little collection of useful things your pond has gathered. Equip keepsakes from a duck’s care menu.</p>'+(got.length?'<div class="list">'+got.map(x=>card(x.e+' '+x.n+' <span class="pill '+x.r+'">'+x.r+'</span>',x.d,x.s+' slot · Quantity '+s.inv[x.id],btn('Care for a duck','goto-flock',false,true))).join('')+'</div>':'<div class="empty"><strong>Nothing in the keepsake basket just yet</strong>Little treasures may appear after you protect the pond from visitors.</div>')+'<p class="section">DUCK COLLECTION</p><div class="list">'+ducks.map(d=>{let found=s.found.includes(d.id);return '<article class="card"><div class="row"><div class="avatar">'+(found?d.e:'?')+'</div><div class="main"><div class="mtitle">'+(found?d.name:'A mystery friend')+' <span class="pill '+d.r+'">'+d.r+'</span></div><div class="desc">'+(found?d.desc:'Not met yet. Keep inviting ducks and see who finds your pond.')+'</div></div></div></article>'}).join('')+'</div>'}

function doRoll(){if(rolling)return;let price=rollCost();if(s.money<price)return say('A few more pennies first, sweet pea.');s.money-=price;s.rolls++;let w=weights(),n=Math.random(),r='Common';for(const key of rarities){n-=w[key];if(n<=0){r=key;break}}let pool=ducks.filter(d=>d.r===r),d=pool[Math.floor(Math.random()*pool.length)];rolling=true;wheelOutcome=null;save();hud();render();animateWheel(d,price)}

function wheelResultText(out){return out.duplicate?'A familiar friend! '+out.duck.name+' sends you a keepsake petal and '+fmt(out.bonus)+' bonus pennies. ♡':'You found '+out.duck.name+'! '+out.duck.e+' A new little friend has joined your flock.'}
function animateWheel(winner,price){const entries=wheelEntries();let cursor=-Math.PI/2,center=0;for(const e of entries){const span=e.p*Math.PI*2;if(e.duck.id===winner.id){center=cursor+span/2;break}cursor+=span}const current=wheelAngle;let delta=((-Math.PI/2-center-current)%(Math.PI*2)+Math.PI*2)%(Math.PI*2);if(delta<.01)delta=Math.PI*2;const target=current+Math.PI*2*5+delta;const reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;const duration=reduced?650:4700,start=performance.now();cancelAnimationFrame(wheelFrame);function step(now){let t=Math.min(1,(now-start)/duration),ease=1-Math.pow(1-t,4);wheelAngle=current+(target-current)*ease;drawWheelElement();if(t<1){wheelFrame=requestAnimationFrame(step);return}wheelAngle=target%(Math.PI*2);drawWheelElement();const duplicate=s.found.includes(winner.id);let bonus=0;if(duplicate){s.inv['petal-token']=(s.inv['petal-token']||0)+1;bonus=Math.max(2,Math.floor(price*.15));s.money+=bonus;say('A familiar friend visited! A petal and a few pennies for you.')}else{s.found.push(winner.id);s.ducks.push({uid:'duck-'+s.nextUid++,species:winner.id,level:1,equipment:{}});say(winner.name+' found your pond! Welcome, little one.');$('event').textContent=winner.name+' has joined your little flock.'}wheelOutcome={duck:winner,duplicate,bonus};rolling=false;hud();save();render()}wheelFrame=requestAnimationFrame(step)}
function buy(k){let price=cost(k);if(s.money<price||s.up[k]>=50)return;s.money-=price;s.up[k]++;say('Your pond feels a little lovelier already.');hud();save();render()}
function care(uid){let d=s.ducks.find(x=>x.uid===uid),price=Math.floor(20*Math.pow(1.65,d.level-1)*def(d).i);if(!d||s.money<price||d.level>=50)return;s.money-=price;d.level++;say(def(d).name+' grew a little braver!');hud();save();render()}
function equip(uid,slot,id){let d=s.ducks.find(x=>x.uid===uid),it=item(id);if(!d||!it||it.s!==slot||(s.inv[id]||0)<1)return;if(d.equipment[slot])s.inv[d.equipment[slot]]=(s.inv[d.equipment[slot]]||0)+1;s.inv[id]--;if(!s.inv[id])delete s.inv[id];d.equipment[slot]=id;save();render();say(it.n+' tucked safely into place.')}
function unequip(uid,slot){let d=s.ducks.find(x=>x.uid===uid);if(!d||!d.equipment[slot])return;s.inv[d.equipment[slot]]=(s.inv[d.equipment[slot]]||0)+1;delete d.equipment[slot];save();render();say('Keepsake safely returned to your basket.')}
function predator(){if(Date.now()-s.encounter<90000)return;s.encounter=Date.now();let max=Math.max(1,Math.floor(Math.log2(power()+1)*1.65)),pool=predators.filter(p=>p.lv<=max),p=pool[Math.floor(Math.random()*pool.length)]||predators[0],win=power()>=p.p*(.8+Math.random()*.5);if(win){let reward=Math.floor(p.reward*(1+s.up.defense*.08));s.money+=reward;s.total+=reward;if(Math.random()<.28){let it=items[Math.floor(Math.random()*items.length)];s.inv[it.id]=(s.inv[it.id]||0)+1;$('event').textContent='Your flock chased off the '+p.n.toLowerCase()+' and found '+it.n+'!'}else $('event').textContent='Your brave flock sent the '+p.n.toLowerCase()+' away! +'+fmt(reward)+' pennies.';say('Pond protected! +'+fmt(reward)+' pennies ♡')}else{$('event').textContent='The '+p.n.toLowerCase()+' wandered off. Everyone is safe; nothing was lost.';say('A close call, but everyone is safe.')}save();hud();if(opened)render()}
function action(a){if(a==='roll')return doRoll();if(a.startsWith('up:'))return buy(a.split(':')[1]);if(a.startsWith('duckup:'))return care(a.split(':')[1]);if(a.startsWith('off:'))return unequip(...a.split(':').slice(1));if(a==='goto-flock')return open('flock');if(a==='motion'){s.motion=!s.motion;save();render();return}if(a==='reset'&&confirm('Start a fresh pond? This clears all Abby’s Pond progress saved in this browser.')){s=fresh();selected=null;save();close();hud();$('event').textContent='A fresh little pond, ready for new memories.';say('A fresh start, with room to grow.')}}

){ctx.fillStyle='#f1c2ca';ctx.fillRect(x+3,y-5,3,3);ctx.fillStyle='#fff0ce';ctx.fillRect(x+4,y-4,1,1)}}duckPositions=[];for(let i=0;i<Math.min(s.ducks.length,14);i++){let d=s.ducks[i],v=def(d),a=i*2.399+now*.000045*(i%2?1:-1),x=pondCx+Math.cos(a)*pondRx*.58,y=pondCy+Math.sin(a)*pondRy*.58+Math.sin(now*.002+i)*2.5;duckPositions.push({x,y,d});ctx.strokeStyle='#c9e9e2';ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(x-2,y+6,10,4,Math.sin(a),0,Math.PI*2);ctx.stroke();ctx.fillStyle='#6ba9a8';ctx.beginPath();ctx.ellipse(x,y+3,8,4,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=v.c;ctx.beginPath();ctx.ellipse(x,y,8,6,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=v.b;ctx.fillRect(x-2,y,6,4);ctx.fillStyle=v.c;ctx.beginPath();ctx.arc(x+5,y-4,4.2,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff8e9';ctx.fillRect(x+6,y-5,2,2);ctx.fillStyle='#544c48';ctx.fillRect(x+7,y-5,1,1);ctx.fillStyle='#d99170';ctx.fillRect(x+9,y-3,4,2);ctx.fillStyle='#d5a75d';ctx.fillRect(x-3,y+5,3,2);ctx.fillRect(x+2,y+5,3,2)}if(s.motion)for(let i=0;i<3;i++){let t=(now*.00025+i/3)%1,x=W*(.2+t*.6),y=H*(.3+Math.sin(t*6+i)*.12);ctx.globalAlpha=.65*(1-t);ctx.fillStyle='#fff3d8';ctx.fillRect(x,y,2,2);ctx.globalAlpha=1}ripples=ripples.filter(r=>now-r.t<2400);ripples.forEach(r=>{let age=(now-r.t)/2400;ctx.strokeStyle='#fff2f2';ctx.globalAlpha=1-age;ctx.lineWidth=1.5;ctx.beginPath();ctx.ellipse(r.x,r.y,5+age*20,3+age*12,0,0,Math.PI*2);ctx.stroke();if(r.heart){ctx.font='12px serif';ctx.fillText('♡',r.x-5,r.y-8)}ctx.globalAlpha=1})}
function frame(now){let dt=Math.min(2,Math.max(0,(now-last)/1000));last=now;if(dt){let gain=income()*dt;s.money+=gain;s.total+=gain;hud();if(now-loopCount>5000){save();loopCount=now}if(Date.now()-s.encounter>90000&&Math.random()<dt/100)predator()}draw(now);requestAnimationFrame(frame)}
function init(){canvas=$('water');ctx=canvas.getContext('2d',{alpha:false});load();hud();document.querySelectorAll('[data-menu]').forEach(b=>b.addEventListener('click',()=>open(b.dataset.menu)));$('settings').addEventListener('click',()=>open('settings'));$('close').addEventListener('click',close);$('backdrop').addEventListener('click',e=>{if(e.target===$('backdrop')&&!rolling)close()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&opened&&!rolling)close()});$('content').addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(b)action(b.dataset.action)});$('content').addEventListener('change',e=>{if(e.target.id==='duck-select'){selected=e.target.value;render()}if(e.target.matches('[data-slot]')&&e.target.value)equip(e.target.dataset.duck,e.target.dataset.slot,e.target.value)});$('love').addEventListener('click',()=>{let r=canvas.getBoundingClientRect();tap({clientX:r.left+r.width/2,clientY:r.top+r.height/2})});canvas.addEventListener('pointerdown',tap);window.addEventListener('resize',()=>draw(performance.now()));window.addEventListener('pagehide',save);document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});last=performance.now();requestAnimationFrame(frame);setInterval(()=>{if(!opened&&Date.now()-s.encounter>90000&&Math.random()<.28)predator()},12000)}

/* Living pond animation pass. These presentation-only overrides preserve the existing economy and save format. */
function predator(){
 if(Date.now()-s.encounter<90000||encounterAnim)return;
 s.encounter=Date.now();
 let max=Math.max(1,Math.floor(Math.log2(power()+1)*1.65)),pool=predators.filter(p=>p.lv<=max),p=pool[Math.floor(Math.random()*pool.length)]||predators[0],win=power()>=p.p*(.8+Math.random()*.5);

 let rect=canvas.getBoundingClientRect();ripples.push({x:rect.width/2,y:rect.height*.54,t:performance.now(),kind:'splash',power:1.35});

  let reward=Math.floor(p.reward*(1+s.up.defense*.08));s.money+=reward;s.total+=reward;
  if(Math.random()<.28){let it=items[Math.floor(Math.random()*items.length)];s.inv[it.id]=(s.inv[it.id]||0)+1;$('event').textContent='Your flock chased off the '+p.n.toLowerCase()+' and found '+it.n+'!'}
  else $('event').textContent='Your brave flock sent the '+p.n.toLowerCase()+' away! +'+fmt(reward)+' pennies.';
  say('Pond protected! +'+fmt(reward)+' pennies ♡');
 }else{$('event').textContent='The '+p.n.toLowerCase()+' wandered off. Everyone is safe; nothing was lost.';say('A close call, but everyone is safe.')}

}
function tap(e){
 let r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,hit=duckPositions.find(d=>Math.hypot(d.x-x,d.y-y)<22);

 s.taps++;let heart=s.taps>=7&&!s.secret;
 if(heart){s.secret=true;s.money+=50;s.total+=50;$('mood').textContent='A tiny secret, just for Abby ♡';$('event').textContent='A heart-shaped ripple glimmers on the water. Some places hold a little extra love.';say('A hidden pond secret, just for Abby. +50 pennies ♡')}
 else if(s.taps%4===0){$('mood').textContent='The pond seems to know you’re here. ♡';say('A tiny heart ripples across the water.')}
 else $('mood').textContent=['The water is lovely today.','The ducks seem happy you stopped by.','A soft breeze dances through the reeds.'][s.taps%3];
 ripples.push({x,y,t:performance.now(),heart,kind:'tap',power:1});save();hud();
}
function draw(now){
 let rect=canvas.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,2),w=Math.max(1,Math.floor(rect.width*dpr)),h=Math.max(1,Math.floor(rect.height*dpr));
 if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h}
 ctx.setTransform(dpr,0,0,dpr,0,0);let W=rect.width,H=rect.height;ctx.clearRect(0,0,W,H);ctx.imageSmoothingEnabled=false;
 const rand=(x,y)=>{let v=Math.sin(x*127.1+y*311.7)*43758.5453;return v-Math.floor(v)};
 ctx.fillStyle='#9bb38c';ctx.fillRect(0,0,W,H);
 for(let i=0;i<W/12;i++){let x=i*12;ctx.fillStyle=i%3?'#a7bd94':'#8da984';ctx.fillRect(x,0,7,H);ctx.fillStyle='#bed0a0';ctx.fillRect(x+3,0,2,H)}
 for(let i=0;i<W/29;i++){let x=rand(i,2)*W,y=14+rand(i,8)*(H-25);if(i%3===0){ctx.fillStyle='#d7c4aa';ctx.fillRect(x,y,7,4);ctx.fillStyle='#f2e7d5';ctx.fillRect(x+2,y-2,4,3)}else{ctx.fillStyle=i%2?'#f1c3c3':'#f7e7b0';ctx.fillRect(x,y,3,3);ctx.fillRect(x-2,y+2,3,3);ctx.fillRect(x+2,y+2,3,3);ctx.fillStyle='#f9f1db';ctx.fillRect(x+1,y+1,2,2)}}
 const pondTop=Math.max(145,H*.17),pondBottom=Math.max(172,H*.20),pondCx=W/2,pondCy=pondTop+(H-pondTop-pondBottom)/2,pondRx=W*.46,pondRy=Math.max(70,(H-pondTop-pondBottom)*.48);
 ctx.fillStyle='#5e9f9f';ctx.beginPath();ctx.ellipse(pondCx,pondCy,pondRx,pondRy,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#80c4c8';ctx.beginPath();ctx.ellipse(pondCx,pondCy,pondRx*.96,pondRy*.96,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#91d0d0';ctx.beginPath();ctx.ellipse(pondCx,pondCy+3,pondRx*.85,pondRy*.85,0,0,Math.PI*2);ctx.fill();
 ctx.save();ctx.beginPath();ctx.ellipse(pondCx,pondCy,pondRx*.98,pondRy*.98,0,0,Math.PI*2);ctx.clip();
 // Calm pond surface: sparse, mostly still pixel highlights with only a faint light shift.
 // The water stays visually quiet; movement is concentrated around swimming ducks.
 for(let i=0;i<34;i++){
  let x=rand(i,12)*W,y=rand(i,22)*H;
  if(((x-pondCx)/pondRx)**2+((y-pondCy)/pondRy)**2<.90){
   let size=i%7===0?3:2;
   ctx.globalAlpha=i%4===0?.30:.16;
   ctx.fillStyle=i%3===0?'#e2f0d8':i%2===0?'#d1e9dc':'#70b4b4';
   ctx.fillRect(Math.round(x),Math.round(y),size,1);
   if(i%8===0){ctx.fillStyle='#f4f0d6';ctx.globalAlpha=.22;ctx.fillRect(Math.round(x+3),Math.round(y+1),2,1)}
  }
 }
 ctx.globalAlpha=1;
 for(let i=0;i<6;i++){let a=i*2.4+.5+Math.sin(now*.00025+i)*.025,x=pondCx+Math.cos(a)*pondRx*.68,y=pondCy+Math.sin(a)*pondRy*.68;ctx.fillStyle='#6f9e78';ctx.beginPath();ctx.ellipse(x,y,11,6,Math.sin(a)+Math.sin(now*.001+i)*.05,0,Math.PI*2);ctx.fill();ctx.fillStyle='#94bd85';ctx.fillRect(x-3,y-2,5,2);if(i%2===0){ctx.fillStyle='#f1c2ca';ctx.fillRect(x+3,y-5,3,3);ctx.fillStyle='#fff0ce';ctx.fillRect(x+4,y-4,1,1)}}
 // Predator encounter: creature advances from the bank, the flock startles, then it retreats.
 if(encounterAnim){
  let t=Math.min(1,(now-encounterAnim.start)/2800),travel=Math.min(1,t/.52),fade=t<.52?Math.min(1,t/.12):(1-t)/.48,p=encounterAnim.p;
  let edgeX=encounterAnim.win?-W*.12:W*1.12,attackX=edgeX+(pondCx-edgeX)*travel,attackY=pondCy-pondRy*.28+Math.sin(now*.018)*3;
  ctx.save();ctx.globalAlpha=Math.max(0,Math.min(1,fade*1.8));ctx.translate(attackX,attackY);ctx.rotate(Math.sin(now*.012)*.08);
  ctx.fillStyle='#4f8f91';ctx.beginPath();ctx.ellipse(0,9,21+Math.sin(now*.02)*2,6,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#5f9b79';ctx.beginPath();ctx.ellipse(0,0,16,10,0,0,Math.PI*2);ctx.fill();
  ctx.font='25px system-ui,Apple Color Emoji,Segoe UI Emoji';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(p.e,0,-2);ctx.restore();
  if(t>.25&&t<.84){ctx.globalAlpha=.65*(1-t);ctx.strokeStyle='#f5ffed';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(attackX,attackY+10,18+(t-.25)*28,5+(t-.25)*8,0,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1}
  if(t>=1)encounterAnim=null;
 }
 duckPositions=[];
 for(let i=0;i<Math.min(s.ducks.length,14);i++){
  let d=s.ducks[i],v=def(d),phase=i*2.399,orbit=now*.00016*(i%2?1:-1),a=phase+orbit;
  let x=pondCx+Math.cos(a)*pondRx*.58,y=pondCy+Math.sin(a)*pondRy*.58+Math.sin(now*.0022+i*1.7)*2.2;
  let bob=Math.sin(now*.006+i*2.1)*1.6,waddle=Math.sin(now*.008+i*1.3)*.11,wing=Math.sin(now*.013+i*2)*.8;
  if(encounterAnim&&(now-encounterAnim.start)<1100){let flee=Math.sin((now-encounterAnim.start)*.012+i)*Math.max(0,1-(now-encounterAnim.start)/1100)*5;x+=Math.cos(a)*flee;y+=Math.sin(a)*flee}
  duckPositions.push({x,y,d});
  // Short, broken pixel arcs trail each duck instead of smooth, fast-moving lines.
  for(let ring=0;ring<2;ring++){
   let pulse=(now*.00019+i*.23+ring*.48)%1,rx=5+pulse*8,ry=2+pulse*3.5;
   ctx.globalAlpha=(1-pulse)*.32;
   ctx.fillStyle=ring===0?'#e8f4dc':'#bde2d9';
   let cx=x-Math.cos(a)*10,cy=y-Math.sin(a)*5+7;
   for(let seg=0;seg<12;seg++){
    let ang=seg*Math.PI/6;
    if(seg%3===1)continue;
    let px=Math.round(cx+Math.cos(ang)*rx),py=Math.round(cy+Math.sin(ang)*ry);

  ctx.fillStyle='#d5a75d';ctx.fillRect(-4,6+Math.sin(now*.012+i)*1.4,3,2);ctx.fillRect(1,6+Math.sin(now*.012+i+Math.PI)*1.4,3,2);
  ctx.fillStyle=v.c;ctx.beginPath();ctx.ellipse(0,1,8,6,0,0,Math.PI*2);ctx.fill();

  let flap=wing*(encounterAnim&&now-encounterAnim.start<1100?1.7:1);ctx.fillStyle=v.c;ctx.beginPath();ctx.ellipse(-1,1+flap*1.5,4,2.7,-.2+flap*.18,0,Math.PI*2);ctx.fill();

  for(let ring=0;ring<3;ring++){let p=(age+ring*.19)%1,alpha=Math.max(0,1-p)*(.72-ring*.14);ctx.globalAlpha=alpha;ctx.strokeStyle=r.heart?'#fff1f2':ring===0?'#f4fff0':'#d5f5ed';ctx.lineWidth=ring===0?1.6:.9;ctx.beginPath();ctx.ellipse(r.x,r.y,(4+p*25)*power,(2+p*11)*power,Math.sin(p*5)*.06,0,Math.PI*2);ctx.stroke()}
  if(r.kind==='splash'){for(let i=0;i<7;i++){let p=(age*1.4+i/7)%1,angle=i*Math.PI*2/7;ctx.globalAlpha=Math.max(0,1-p);ctx.fillStyle=i%2?'#e5f5e8':'#fff8e9';ctx.fillRect(r.x+Math.cos(angle)*p*24-1,r.y+Math.sin(angle)*p*12-1,2,2)}}
  if(r.heart){ctx.globalAlpha=1-age;ctx.font='12px serif';ctx.fillStyle='#fff4f1';ctx.fillText('♡',r.x-5,r.y-8-age*12)}ctx.globalAlpha=1;
