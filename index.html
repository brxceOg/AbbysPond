function rollMenu(c){header('A NEW LITTLE FRIEND','Find a duck');let w=weights();c.innerHTML='<p class="intro">Every duck in the pond has a place on the wheel. Take a breath, give it a spin, and see which little friend finds you. Your luck upgrades still determine the real odds.</p><div class="card"><div class="mtitle">Your collection journey</div><div class="track"><span style="width:'+s.found.length/ducks.length*100+'%"></span></div><div class="meta">'+s.found.length+' / '+ducks.length+' unique ducks discovered</div></div><div class="wheel-card"><div class="wheel-wrap"><canvas id="duck-wheel" role="img" aria-label="Prize wheel showing every possible duck; the pointer marks the result" width="640" height="640"></canvas></div><div class="wheel-result" id="wheel-result">'+(rolling?'The wheel is spinning…':wheelOutcome?wheelResultText(wheelOutcome):'Who will waddle into your pond next? ♡')+'</div><div style="margin-top:11px">'+btn(rolling?'Spinning…':(wheelOutcome?'Invite another duck · ':'Spin for a duck · ')+fmt(rollCost())+' pennies','roll',rolling||s.money<rollCost())+'</div><p class="wheel-note">The wheel’s slices reflect each duck’s actual chance. Luck upgrades change the odds; the animation never changes the result.</p></div><p class="section">CURRENT RARITY ODDS</p><div class="wheel-odds">'+rarities.map(r=>'<div class="setting"><span class="pill '+r+'">'+r+'</span><strong>'+(w[r]*100).toFixed(w[r]<.01?2:1)+'%</strong></div>').join('')+'</div><p class="intro" style="margin-top:12px">Luck level '+s.up.luck+' · familiar friends bring a keepsake petal and a few bonus pennies.</p>';drawWheelElement();}

function wheelResultText(out){return out.duplicate?'A familiar friend! '+out.duck.name+' sends you a keepsake petal and '+fmt(out.bonus)+' bonus pennies. ♡':'You found '+out.duck.name+'! '+out.duck.e+' A new little friend has joined your flock.'}
function animateWheel(winner,price){const entries=wheelEntries();let cursor=-Math.PI/2,center=0;for(const e of entries){const span=e.p*Math.PI*2;if(e.duck.id===winner.id){center=cursor+span/2;break}cursor+=span}const current=wheelAngle;let delta=((-Math.PI/2-center-current)%(Math.PI*2)+Math.PI*2)%(Math.PI*2);if(delta<.01)delta=Math.PI*2;const target=current+Math.PI*2*5+delta;const reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;const duration=reduced?650:4700,start=performance.now();cancelAnimationFrame(wheelFrame);function step(now){let t=Math.min(1,(now-start)/duration),ease=1-Math.pow(1-t,4);wheelAngle=current+(target-current)*ease;drawWheelElement();if(t<1){wheelFrame=requestAnimationFrame(step);return}wheelAngle=target%(Math.PI*2);drawWheelElement();const duplicate=s.found.includes(winner.id);let bonus=0;if(duplicate){s.inv['petal-token']=(s.inv['petal-token']||0)+1;bonus=Math.max(2,Math.floor(price*.15));s.money+=bonus;say('A familiar friend visited! A petal and a few pennies for you.')}else{s.found.push(winner.id);s.ducks.push({uid:'duck-'+s.nextUid++,species:winner.id,level:1,equipment:{}});say(winner.name+' found your pond! Welcome, little one.');$('event').textContent=winner.name+' has joined your little flock.'}wheelOutcome={duck:winner,duplicate,bonus};rolling=false;hud();save();render()}wheelFrame=requestAnimationFrame(step)}

function care(uid){let d=s.ducks.find(x=>x.uid===uid),price=Math.floor(20*Math.pow(1.65,d.level-1)*def(d).i);if(!d||s.money<price||d.level>=50)return;s.money-=price;d.level++;say(def(d).name+' grew a little braver!');hud();save();render()}
function equip(uid,slot,id){let d=s.ducks.find(x=>x.uid===uid),it=item(id);if(!d||!it||it.s!==slot||(s.inv[id]||0)<1)return;if(d.equipment[slot])s.inv[d.equipment[slot]]=(s.inv[d.equipment[slot]]||0)+1;s.inv[id]--;if(!s.inv[id])delete s.inv[id];d.equipment[slot]=id;save();render();say(it.n+' tucked safely into place.')}

function predator(){if(Date.now()-s.encounter<90000)return;s.encounter=Date.now();let max=Math.max(1,Math.floor(Math.log2(power()+1)*1.65)),pool=predators.filter(p=>p.lv<=max),p=pool[Math.floor(Math.random()*pool.length)]||predators[0],win=power()>=p.p*(.8+Math.random()*.5);if(win){let reward=Math.floor(p.reward*(1+s.up.defense*.08));s.money+=reward;s.total+=reward;if(Math.random()<.28){let it=items[Math.floor(Math.random()*items.length)];s.inv[it.id]=(s.inv[it.id]||0)+1;$('event').textContent='Your flock chased off the '+p.n.toLowerCase()+' and found '+it.n+'!'}else $('event').textContent='Your brave flock sent the '+p.n.toLowerCase()+' away! +'+fmt(reward)+' pennies.';say('Pond protected! +'+fmt(reward)+' pennies ♡')}else{$('event').textContent='The '+p.n.toLowerCase()+' wandered off. Everyone is safe; nothing was lost.';say('A close call, but everyone is safe.')}save();hud();if(opened)render()}
