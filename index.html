px 60px #38262235;overflow:hidden;animation:rise .18s ease-out}.mhead{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 13px;border-bottom:1px solid #f4e5de;background:linear-gradient(120deg,#fff9f1,#fff0ed)}h2{font-size:23px}.close{font-size:27px;box-shadow:none}.content{padding:14px 16px 20px;overflow:auto;overscroll-behavior:contain}.intro{margin:0 0 13px;font-size:12px;color:#8e7a75;line-height:1.55}.list{display:grid;gap:9px}.card{padding:12px;border:1px solid #efded5;background:#fffaf5;border-radius:16px}.row{display:flex;align-items:center;gap:10px}.main{flex:1;min-width:0}.mtitle{font-weight:800;font-size:13px;color:#76565b}.desc{font-size:11px;color:#9a8580;line-height:1.45;margin-top:3px}.meta{font-size:10px;color:#8b9c7d;font-weight:800;margin-top:5px}.primary,.secondary,.danger{border:0;border-radius:12px;padding:10px 13px;min-height:39px;font-size:11px;font-weight:800;white-space:nowrap}.primary{background:#b96f7d;color:white;box-shadow:0 3px 0 #9e596a}.primary:disabled{background:#d7c6c0;box-shadow:none;opacity:.8;cursor:not-allowed}.secondary{background:#e5eee0;color:#5d8063;border:1px solid #cbdcc7}.danger{background:#f7e1df;color:#a14e5d;border:1px solid #e8c1c0}.pill{display:inline-flex;padding:4px 7px;border-radius:999px;background:#f4e4dd;color:#a66d73;font-size:9px;font-weight:800}.Common{background:#ece8e2;color:#827a70}.Uncommon{background:#e0eddb;color:#5d855f}.Rare{background:#deedf0;color:#528c9c}.Epic{background:#eee1f4;color:#9468a4}.Legendary{background:#f8ebcb;color:#a47b30}.Mythic{background:#f5d9e4;color:#b44e80}.avatar{width:48px;height:48px;flex:0 0 48px;display:grid;place-items:center;border-radius:15px;background:#e1eff0;font-size:29px}.track{height:7px;background:#f0e4db;border-radius:99px;overflow:hidden;margin-top:9px}.track span{display:block;height:100%;background:#a9c2a1}.section{font-size:10px;font-weight:800;color:#ad8b84;letter-spacing:1.1px;margin:17px 0 8px}.select{width:100%;border:1px solid #ead8ce;border-radius:12px;padding:11px;background:#fffdf8;color:#6f5959;font:inherit;font-size:12px;margin:5px 0 10px}.setting{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #f2e5de;font-size:12px}.empty{text-align:center;padding:26px 15px;color:#9b8580;font-size:12px;line-height:1.6}.empty strong{display:block;font-family:Quicksand,sans-serif;font-size:18px;color:#815c64;margin-bottom:5px}.offline{background:#edf3e8;border:1px solid #d5e2cc;border-radius:15px;padding:12px;margin-bottom:12px;color:#617a5f;font-size:12px;line-height:1.5}.toast{position:fixed;z-index:20;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#76565b;color:#fff8f0;border-radius:999px;padding:11px 16px;box-shadow:0 8px 24px #4d2e2e30;font-size:12px;font-weight:800;max-width:90vw;text-align:center;transition:opacity .2s,transform .2s}.toast.show{opacity:1;transform:translate(-50%,0)}@keyframes rise{from{transform:translateY(14px);opacity:.7}to{transform:translateY(0);opacity:1}}@media(min-width:600px){body{padding-top:22px}.app{padding-bottom:24px}.pond{border-width:6px}.actions{gap:12px}.action{padding:13px}.backdrop{align-items:center}}@media(max-width:360px){.app{padding-top:9px}.brand h1{font-size:21px}.stat{padding:9px}.stat strong{font-size:20px}.action{gap:6px;padding:9px 7px}.tile{flex-basis:30px;width:30px;height:32px}.action strong{font-size:11px}.action small{font-size:8px}.ribbon{font-size:9px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head><body><main class="app"><header class="top"><div class="flower">✿</div><div class="brand"><p class="eyebrow">A LITTLE PLACE TO REST</p><h1>Abby's Pond</h1></div><button class="icon" id="settings" aria-label="Settings">⚙</button></header>
<section class="hud"><div class="stat"><label>Pond pennies</label><strong id="money">30</strong><small id="income">+1 / sec</small></div><div class="stat"><label>Your flock</label><strong id="count">1 duck</strong><small id="collection">1 of 12 found</small></div></section>
<section class="pond"><div class="ribbon"><span>♡</span> your own little corner of the world <span>♡</span></div><canvas id="water" aria-label="Animated pond with ducks; tap the water to make ripples"></canvas><div class="pondfoot"><span id="mood">The water is lovely today.</span><button class="tiny" id="love">Send a little love ♡</button></div></section>
<section class="actions"><button class="action" data-menu="roll"><span class="tile">✿</span><span><strong>Find a duck</strong><small>Invite a new friend</small></span><span class="chev">›</span></button><button class="action" data-menu="upgrades"><span class="tile sage">❀</span><span><strong>Pond upgrades</strong><small>Help your little world grow</small></span><span class="chev">›</span></button><button class="action" data-menu="flock"><span class="tile blue">♡</span><span><strong>Your flock</strong><small>Care for each duck</small></span><span class="chev">›</span></button><button class="action" data-menu="inventory"><span class="tile gold">✧</span><span><strong>Keepsakes</strong><small>Little treasures you've found</small></span><span class="chev">›</span></button></section>
<div class="event" id="event" role="status">The reeds rustle softly. All is peaceful.</div><footer class="footer">made with a little extra love <span style="color:#c87e8c">♡</span></footer></main>
<div class="backdrop" id="backdrop" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="title"><header class="mhead"><div><p class="eyebrow" id="kicker">YOUR POND</p><h2 id="title">A little menu</h2></div><button class="icon close" id="close" aria-label="Close menu">×</button></header><div class="content" id="content"></div></section></div><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),KEY='abbys-pond-save-v1',CAP=28800;
const ducks=[
{id:'meadow',name:'Meadow',r:'Common',e:'🦆',c:'#e9c777',b:'#fff0c9',i:1,a:2,h:12,desc:'A sunny little classic. The heart of any flock.'},
{id:'puddle',name:'Puddle',r:'Common',e:'🐤',c:'#f5dc7b',b:'#fff2b7',i:1.2,a:1,h:10,desc:'Small, bright, and always first to explore.'},
{id:'clover',name:'Clover',r:'Uncommon',e:'🦆',c:'#a8b78b',b:'#e7e8c9',i:2.4,a:4,h:17,desc:'A lucky duck with a fondness for wildflowers.'},
{id:'bluebell',name:'Bluebell',r:'Uncommon',e:'🪿',c:'#a7cbd1',b:'#eaf4ed',i:2.7,a:4,h:19,desc:'Gentle, graceful, and a very brave swimmer.'},
{id:'peaches',name:'Peaches',r:'Rare',e:'🦆',c:'#e8a28e',b:'#ffe0c7',i:5,a:7,h:26,desc:'Brings a little sunset wherever she waddles.'},
{id:'lavender',name:'Lavender',r:'Rare',e:'🦆',c:'#b9a3ce',b:'#eee3f3',i:5.8,a:8,h:27,desc:'Quiet magic, soft feathers, fearless heart.'},
{id:'moonbeam',name:'Moonbeam',r:'Epic',e:'🦢',c:'#d5d9e8',b:'#fff8fa',i:12,a:14,h:39,desc:'Shimmers like moonlight across still water.'},
{id:'rosie',name:'Rosie',r:'Epic',e:'🦆',c:'#df9eaf',b:'#ffeced',i:14,a:15,h:42,desc:'A rosy little dream wrapped in feathers.'},
{id:'sunpetal',name:'Sunpetal',r:'Legendary',e:'🦆',c:'#f1c45e',b:'#fff0ad',i:28,a:27,h:63,desc:'A tiny golden sun with an enormous spirit.'},
{id:'stardust',name:'Stardust',r:'Legendary',e:'🦢',c:'#b8d6e7',b:'#fff8ff',i:34,a:31,h:70,desc:'Leaves tiny sparkles in the wake behind her.'},
{id:'heartsong',name:'Heartsong',r:'Mythic',e:'🦆',c:'#e6a2b9',b:'#fff0f2',i:75,a:55,h:100,desc:'A once-in-a-blue-moon duck who carries a little love.'},
{id:'wish',name:'Wish',r:'Mythic',e:'🦢',c:'#f5e7b4',b:'#fffdf0',i:95,a:62,h:115,desc:'A rare wish come true, gliding through your pond.'}];
const rarities=['Common','Uncommon','Rare','Epic','Legendary','Mythic'],base={Common:55,Uncommon:25,Rare:12,Epic:5.5,Legendary:2,Mythic:.5};
const items=[{id:'clover-charm',n:'Clover Charm',e:'☘️',s:'Charm',r:'Uncommon',d:'+12% income',i:.12,a:0,h:0},{id:'rose-ribbon',n:'Rose Ribbon',e:'🎀',s:'Ribbon',r:'Rare',d:'+3 attack',i:0,a:3,h:0},{id:'pearl-shell',n:'Pearl Shell',e:'🐚',s:'Shell',r:'Rare',d:'+8 health',i:0,a:0,h:8},{id:'moon-pendant',n:'Moon Pendant',e:'🌙',s:'Charm',r:'Epic',d:'+25% income and +5 attack',i:.25,a:5,h:0},{id:'petal-token',n:'Keepsake Petal',e:'🌸',s:'Keepsake',r:'Uncommon',d:'A tiny petal from a familiar duck. A little reminder that every visit matters.',i:0,a:0,h:0}];
const predators=[{n:'Snapping turtle',e:'🐢',lv:1,p:8,reward:12},{n:'Water snake',e:'🐍',lv:2,p:22,reward:35},{n:'Raccoon',e:'🦝',lv:3,p:55,reward:90},{n:'Red fox',e:'🦊',lv:5,p:120,reward:240},{n:'Hawk',e:'🦅',lv:8,p:260,reward:650},{n:'Coyote',e:'🐺',lv:12,p:550,reward:1600}];
const fresh=()=>({version:1,money:30,ducks:[{uid:'duck-1',species:'meadow',level:1,equipment:{}}],nextUid:2,up:{income:0,luck:0,defense:0,roll:0,offline:0},inv:{},found:['meadow'],rolls:0,saved:Date.now(),encounter:Date.now(),taps:0,secret:false,total:0,motion:true});
let s=fresh(),canvas,ctx,last=Date.now(),selected=null,menu=null,opened=false,duckPositions=[],ripples=[],toastTime=0,loopCount=0;
const def=d=>ducks.find(x=>x.id===d.species)||ducks[0],item=id=>items.find(x=>x.id===id),fmt=n=>n>=1e6?(n/1e6).toFixed(1)+'m':n>=1e3?(n/1e3).toFixed(1)+'k':(n<10&&n%1?n.toFixed(1):Math.floor(n)).toLocaleString('en-US'),dur=n=>n>=3600?Math.floor(n/3600)+'h '+Math.floor(n%3600/60)+'m':Math.max(1,Math.floor(n/60))+' minutes';
function incomeDuck(d){let bonus=0;Object.values(d.equipment||{}).forEach(id=>{if(item(id))bonus+=item(id).i});return def(d).i*(1+(d.level-1)*.22)*(1+s.up.income*.12)*(1+bonus)}
function income(){return s.ducks.reduce((a,d)=>a+incomeDuck(d),0)}
function power(){return s.ducks.reduce((a,d)=>a+def(d).a+(d.level-1)*2+Object.values(d.equipment||{}).reduce((v,id)=>v+(item(id)?item(id).a+item(id).h*.15:0),0),0)+s.up.defense*1.5}
function cost(k){return Math.floor(({income:35,luck:55,defense:45,roll:70,offline:80})[k]*Math.pow(k==='luck'?1.78:1.62,s.up[k]))}
function rollCost(){return Math.max(1,Math.floor(35*Math.pow(1.13,s.rolls)*(1-s.up.roll*.025)))}
function weights(){let w={...base};['Uncommon','Rare','Epic','Legendary','Mythic'].forEach(r=>w[r]*=1+s.up.luck*.18);let total=Object.values(w).reduce((a,b)=>a+b,0);return Object.fromEntries(rarities.map(r=>[r,w[r]/total]))}
function save(){s.saved=Date.now();try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){$('event').textContent='Browser storage is unavailable; progress may not persist.'}}
function load(){try{const raw=localStorage.getItem(KEY);if(!raw)return;const x=JSON.parse(raw);if(!x||x.version!==1||!Array.isArray(x.ducks))throw Error('bad save');s={...fresh(),...x};s.up={...fresh().up,...x.up};s.inv=x.inv&&typeof x.inv==='object'?x.inv:{};s.ducks=s.ducks.filter(d=>d&&ducks.some(v=>v.id===d.species));if(!s.ducks.length)s.ducks=fresh().ducks;s.found=[...new Set([...(Array.isArray(s.found)?s.found:[]),...s.ducks.map(d=>d.species)])].filter(id=>ducks.some(d=>d.id===id));s.money=Math.max(0,Number(s.money)||0);s.saved=Number(s.saved)||Date.now();s.encounter=Number(s.encounter)||Date.now();const away=Math.min(CAP,Math.max(0,(Date.now()-s.saved)/1000)),gain=income()*away*Math.min(.75,.5+s.up.offline*.05);if(gain>=1){s.money+=gain;s.total+=gain;setTimeout(()=>{open('upgrades');$('content').insertAdjacentHTML('afterbegin','<div class="offline"><strong>Welcome back, pond keeper ♡</strong><br>Your ducks gathered <strong>'+fmt(gain)+' pennies</strong> while you were away ('+dur(away)+').</div>')},500)}}catch(e){s=fresh();setTimeout(()=>say('A fresh pond is ready. Your old save could not be read.'),300)}}
function say(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(toastTime);toastTime=setTimeout(()=>$('toast').classList.remove('show'),2300)}
function hud(){$('money').textContent=fmt(s.money);$('income').textContent='+'+fmt(income())+' / sec';$('count').textContent=s.ducks.length+' duck'+(s.ducks.length===1?'':'s');$('collection').textContent=s.found.length+' of '+ducks.length+' found'}
function header(a,b){$('kicker').textContent=a;$('title').textContent=b}
function btn(label,action,disabled=false,secondary=false){return '<button class="'+(secondary?'secondary':'primary')+'" data-action="'+action+'" '+(disabled?'disabled':'')+'>'+label+'</button>'}
function card(title,desc,meta,button,extra=''){return '<article class="card"><div class="row"><div class="main"><div class="mtitle">'+title+'</div><div class="desc">'+desc+'</div><div class="meta">'+meta+'</div>'+extra+'</div>'+button+'</div></article>'}
function open(k){menu=k;opened=true;$('backdrop').hidden=false;render();$('close').focus()}
function close(){opened=false;$('backdrop').hidden=true;menu=null}
function render(){const c=$('content');c.innerHTML='';if(menu==='roll')rollMenu(c);if(menu==='upgrades')upgradeMenu(c);if(menu==='flock')flockMenu(c);if(menu==='inventory')inventoryMenu(c);if(menu==='settings')settingsMenu(c)}
function rollMenu(c){header('A NEW LITTLE FRIEND','Find a duck');let w=weights();c.innerHTML='<p class="intro">A little surprise might be waiting in the reeds. Every friend brings their own income and courage. Luck upgrades gently improve the odds of rarer visitors.</p><div class="card"><div class="mtitle">Your next surprise</div><div class="desc">One new duck per invitation. Familiar faces leave a few bonus pennies and a petal of good luck.</div><div class="track"><span style="width:'+s.found.length/ducks.length*100+'%"></span></div><div class="meta">'+s.found.length+' / '+ducks.length+' unique ducks discovered</div><div style="margin-top:12px">'+btn('Invite a duck · '+fmt(rollCost())+' pennies','roll',s.money<rollCost())+'</div></div><p class="section">CURRENT ODDS</p>'+rarities.map(r=>'<div class="setting"><span class="pill '+r+'">'+r+'</span><strong>'+ (w[r]*100).toFixed(w[r]<.01?2:1)+'%</strong></div>').join('')+'<p class="intro" style="margin-top:12px">Luck level '+s.up.luck+' · odds are normalized and shown before every roll.</p>'}
function upgradeMenu(c){header('GROW AT YOUR OWN PACE','Pond upgrades');let defs=[['income','Bountiful pond','Every duck earns 12% more pennies per level.'],['luck','Lucky wildflowers','Improves the chance of rarer ducks by 18% per level.'],['defense','Brave little flock','Adds 1.5 flock power per level when visitors appear.'],['roll','Friendly invitations','Lowers duck invitation costs by 2.5% per level.'],['offline','Sleepytime savings','Improves offline earnings by 5% per level, up to 75%.']];c.innerHTML='<p class="intro">Small, thoughtful improvements make this pond lovelier over time. Every upgrade has a clear cost and lasting effect.</p><div class="list">'+defs.map(([k,t,d])=>card(t,d,'Level '+s.up[k]+' · Next cost: '+fmt(cost(k)),btn('Upgrade','up:'+k,s.money<cost(k)||s.up[k]>=50))).join('')+'</div>'}
function flockMenu(c){header('EVERY DUCK IS SPECIAL','Your flock');if(!selected||!s.ducks.some(d=>d.uid===selected))selected=s.ducks[0].uid;let d=s.ducks.find(x=>x.uid===selected),v=def(d),uc=Math.floor(20*Math.pow(1.65,d.level-1)*v.i);c.innerHTML='<p class="intro">Choose a duck to see their strengths, improve their skills, and equip a keepsake.</p><label class="section" for="duck-select">CHOOSE YOUR DUCK</label><select class="select" id="duck-select">'+s.ducks.map(x=>'<option value="'+x.uid+'" '+(x.uid===d.uid?'selected':'')+'>'+def(x).name+' · Lv '+x.level+'</option>').join('')+'</select><div class="card"><div class="row"><div class="avatar">'+v.e+'</div><div class="main"><div class="mtitle">'+v.name+' <span class="pill '+v.r+'">'+v.r+'</span></div><div class="desc">'+v.desc+'</div><div class="meta">Level '+d.level+' · '+fmt(incomeDuck(d))+' pennies/sec</div></div></div><div class="setting"><span>Bravery</span><strong>'+(v.a+(d.level-1)*2)+' power</strong></div><div class="setting"><span>Resilience</span><strong>'+(v.h+(d.level-1)*4)+' health</strong></div><div style="margin-top:12px">'+btn('Care for '+v.name+' · '+fmt(uc), 'duckup:'+d.uid,s.money<uc||d.level>=50)+'</div></div><p class="section">KEEPSAKE SLOTS</p><p class="intro">Swap keepsakes any time without losing them.</p>'+['Charm','Ribbon','Shell'].map(slot=>{let equipped=item(d.equipment[slot]),available=items.filter(x=>x.s===slot&&(s.inv[x.id]||0)>0);return '<div class="card"><div class="row"><div class="main"><div class="mtitle">'+slot+'</div><div class="desc">'+(equipped?equipped.e+' '+equipped.n+' · '+equipped.d:'Nothing tucked in here yet.')+'</div></div>'+(equipped?btn('Remove','off:'+d.uid+':'+slot,false,true):'')+'</div>'+(available.length&&!equipped?'<select class="select" data-slot="'+slot+'" data-duck="'+d.uid+'"><option value="">Choose a keepsake…</option>'+available.map(x=>'<option value="'+x.id+'">'+x.n+' · '+x.d+' ('+s.inv[x.id]+')</option>').join('')+'</select>':'')+'</div>'}).join('')}
function inventoryMenu(c){header('LITTLE TREASURES','Keepsakes');let got=items.filter(x=>(s.inv[x.id]||0)>0);c.innerHTML='<p class="intro">A little collection of useful things your pond has gathered. Equip keepsakes from a duck’s care menu.</p>'+(got.length?'<div class="list">'+got.map(x=>card(x.e+' '+x.n+' <span class="pill '+x.r+'">'+x.r+'</span>',x.d,x.s+' slot · Quantity '+s.inv[x.id],btn('Care for a duck','goto-flock',false,true))).join('')+'</div>':'<div class="empty"><strong>Nothing in the keepsake basket just yet</strong>Little treasures may appear after you protect the pond from visitors.</div>')+'<p class="section">DUCK COLLECTION</p><div class="list">'+ducks.map(d=>{let found=s.found.includes(d.id);return '<article class="card"><div class="row"><div class="avatar">'+(found?d.e:'?')+'</div><div class="main"><div class="mtitle">'+(found?d.name:'A mystery friend')+' <span class="pill '+d.r+'">'+d.r+'</span></div><div class="desc">'+(found?d.desc:'Not met yet. Keep inviting ducks and see who finds your pond.')+'</div></div></div></article>'}).join('')+'</div>'}
function settingsMenu(c){header('MAKE YOURSELF COMFORTABLE','Pond settings');c.innerHTML='<p class="intro">A few gentle options to keep your little pond feeling just right.</p><div class="setting"><span>Reduced motion</span>'+btn(s.motion?'On':'Off','motion',false,true)+'</div><div class="setting"><span>Save status</span><strong>Auto-save enabled</strong></div><div class="setting"><span>Offline earnings cap</span><strong>8 hours</strong></div><div class="card" style="margin-top:16px"><div class="mtitle">Start a fresh pond</div><div class="desc">This permanently clears this browser’s Abby’s Pond save.</div><div style="margin-top:11px">'+btn('Reset all progress','reset',false,true)+'</div></div>'}
function doRoll(){let price=rollCost();if(s.money<price)return say('A few more pennies first, sweet pea.');s.money-=price;s.rolls++;let w=weights(),n=Math.random(),r='Common';for(const key of rarities){n-=w[key];if(n<=0){r=key;break}}let pool=ducks.filter(d=>d.r===r),d=pool[Math.floor(Math.random()*pool.length)];if(s.found.includes(d.id)){s.inv['petal-token']=(s.inv['petal-token']||0)+1;s.money+=Math.max(2,Math.floor(price*.15));say('A familiar friend visited! A petal and a few pennies for you.')}else{s.found.push(d.id);s.ducks.push({uid:'duck-'+s.nextUid++,species:d.id,level:1,equipment:{}});say(d.name+' found your pond! Welcome, little one.');$('event').textContent=d.name+' has joined your little flock.'}hud();save();render()}
function buy(k){let price=cost(k);if(s.money<price||s.up[k]>=50)return;s.money-=price;s.up[k]++;say('Your pond feels a little lovelier already.');hud();save();render()}
function care(uid){let d=s.ducks.find(x=>x.uid===uid),price=Math.floor(20*Math.pow(1.65,d.level-1)*def(d).i);if(!d||s.money<price||d.level>=50)return;s.money-=price;d.level++;say(def(d).name+' grew a little braver!');hud();save();render()}
function equip(uid,slot,id){let d=s.ducks.find(x=>x.uid===uid),it=item(id);if(!d||!it||it.s!==slot||(s.inv[id]||0)<1)return;if(d.equipment[slot])s.inv[d.equipment[slot]]=(s.inv[d.equipment[slot]]||0)+1;s.inv[id]--;if(!s.inv[id])delete s.inv[id];d.equipment[slot]=id;save();render();say(it.n+' tucked safely into place.')}
function unequip(uid,slot){let d=s.ducks.find(x=>x.uid===uid);if(!d||!d.equipment[slot])return;s.inv[d.equipment[slot]]=(s.inv[d.equipment[slot]]||0)+1;delete d.equipment[slot];save();render();say('Keepsake safely returned to your basket.')}
function predator(){if(Date.now()-s.encounter<90000)return;s.encounter=Date.now();let max=Math.max(1,Math.floor(Math.log2(power()+1)*1.65)),pool=predators.filter(p=>p.lv<=max),p=pool[Math.floor(Math.random()*pool.length)]||predators[0],win=power()>=p.p*(.8+Math.random()*.5);if(win){let reward=Math.floor(p.reward*(1+s.up.defense*.08));s.money+=reward;s.total+=reward;if(Math.random()<.28){let it=items[Math.floor(Math.random()*items.length)];s.inv[it.id]=(s.inv[it.id]||0)+1;$('event').textContent='Your flock chased off the '+p.n.toLowerCase()+' and found '+it.n+'!'}else $('event').textContent='Your brave flock sent the '+p.n.toLowerCase()+' away! +'+fmt(reward)+' pennies.';say('Pond protected! +'+fmt(reward)+' pennies ♡')}else{$('event').textContent='The '+p.n.toLowerCase()+' wandered off. Everyone is safe; nothing was lost.';say('A close call, but everyone is safe.')}save();hud();if(opened)render()}
function action(a){if(a==='roll')return doRoll();if(a.startsWith('up:'))return buy(a.split(':')[1]);if(a.startsWith('duckup:'))return care(a.split(':')[1]);if(a.startsWith('off:'))return unequip(...a.split(':').slice(1));if(a==='goto-flock')return open('flock');if(a==='motion'){s.motion=!s.motion;save();render();return}if(a==='reset'&&confirm('Start a fresh pond? This clears all Abby’s Pond progress saved in this browser.')){s=fresh();selected=null;save();close();hud();$('event').textContent='A fresh little pond, ready for new memories.';say('A fresh start, with room to grow.')}}
function tap(e){let r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,hit=duckPositions.find(d=>Math.hypot(d.x-x,d.y-y)<20);if(hit){say(def(hit.d).name+' says quack!');return}s.taps++;let heart=s.taps>=7&&!s.secret;if(heart){s.secret=true;s.money+=50;s.total+=50;$('mood').textContent='A tiny secret, just for Abby ♡';$('event').textContent='A heart-shaped ripple glimmers on the water. Some places hold a little extra love.';say('A hidden pond secret, just for Abby. +50 pennies ♡')}else if(s.taps%4===0){$('mood').textContent='The pond seems to know you’re here. ♡';say('A tiny heart ripples across the water.')}else $('mood').textContent=['The water is lovely today.','The ducks seem happy you stopped by.','A soft breeze dances through the reeds.'][s.taps%3];ripples.push({x,y,t:performance.now(),heart});save();hud()}
function draw(now){let rect=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2),w=Math.max(1,Math.floor(rect.width*dpr)),h=Math.max(1,Math.floor(rect.height*dpr));if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h}ctx.setTransform(dpr,0,0,dpr,0,0);let W=rect.width,H=rect.height;ctx.clearRect(0,0,W,H);ctx.imageSmoothingEnabled=false;const rand=(x,y)=>{let v=Math.sin(x*127.1+y*311.7)*43758.5453;return v-Math.floor(v)};ctx.fillStyle='#9bb38c';ctx.fillRect(0,0,W,H);for(let i=0;i<W/12;i++){let x=i*12;ctx.fillStyle=i%3?'#a7bd94':'#8da984';ctx.fillRect(x,0,7,H);ctx.fillStyle='#bed0a0';ctx.fillRect(x+3,0,2,H)}for(let i=0;i<W/29;i++){let x=rand(i,2)*W,y=14+rand(i,8)*(H-25);if(i%3===0){ctx.fillStyle='#d7c4aa';ctx.fillRect(x,y,7,4);ctx.fillStyle='#f2e7d5';ctx.fillRect(x+2,y-2,4,3)}else{ctx.fillStyle=i%2?'#f1c3c3':'#f7e7b0';ctx.fillRect(x,y,3,3);ctx.fillRect(x-2,y+2,3,3);ctx.fillRect(x+2,y+2,3,3);ctx.fillStyle='#f9f1db';ctx.fillRect(x+1,y+1,2,2)}}ctx.fillStyle='#5e9f9f';ctx.beginPath();ctx.ellipse(W/2,H/2,W*.47,H*.47,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#80c4c8';ctx.beginPath();ctx.ellipse(W/2,H/2,W*.45,H*.45,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#91d0d0';ctx.beginPath();ctx.ellipse(W/2,H/2+3,W*.4,H*.4,0,0,Math.PI*2);ctx.fill();for(let i=0;i<30;i++){let x=rand(i,12)*W,y=rand(i,22)*H;if(((x-W/2)/(W*.46))**2+((y-H/2)/(H*.46))**2<.92){ctx.fillStyle=i%3?'#a7dcda':'#c0e4dc';ctx.fillRect(x,y,rand(i,4)*10+3,2);if(i%4===0){ctx.fillStyle='#d0e9dd';ctx.fillRect(x+4,y-2,2,2)}}}for(let i=0;i<6;i++){let a=i*2.4+.5,x=W/2+Math.cos(a)*W*.32,y=H/2+Math.sin(a)*H*.32;ctx.fillStyle='#6f9e78';ctx.beginPath();ctx.ellipse(x,y,11,6,Math.sin(a),0,Math.PI*2);ctx.fill();ctx.fillStyle='#94bd85';ctx.fillRect(x-3,y-2,5,2);if(i%2===0){ctx.fillStyle='#f1c2ca';ctx.fillRect(x+3,y-5,3,3);ctx.fillStyle='#fff0ce';ctx.fillRect(x+4,y-4,1,1)}}duckPositions=[];for(let i=0;i<Math.min(s.ducks.length,14);i++){let d=s.ducks[i],v=def(d),a=i*2.399+now*.000045*(i%2?1:-1),x=W/2+Math.cos(a)*W*.27,y=H/2+Math.sin(a)*H*.27+Math.sin(now*.002+i)*2.5;duckPositions.push({x,y,d});ctx.strokeStyle='#c9e9e2';ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(x-2,y+6,10,4,Math.sin(a),0,Math.PI*2);ctx.stroke();ctx.fillStyle='#6ba9a8';ctx.beginPath();ctx.ellipse(x,y+3,8,4,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=v.c;ctx.beginPath();ctx.ellipse(x,y,8,6,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=v.b;ctx.fillRect(x-2,y,6,4);ctx.fillStyle=v.c;ctx.beginPath();ctx.arc(x+5,y-4,4.2,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff8e9';ctx.fillRect(x+6,y-5,2,2);ctx.fillStyle='#544c48';ctx.fillRect(x+7,y-5,1,1);ctx.fillStyle='#d99170';ctx.fillRect(x+9,y-3,4,2);ctx.fillStyle='#d5a75d';ctx.fillRect(x-3,y+5,3,2);ctx.fillRect(x+2,y+5,3,2)}if(s.motion)for(let i=0;i<3;i++){let t=(now*.00025+i/3)%1,x=W*(.2+t*.6),y=H*(.3+Math.sin(t*6+i)*.12);ctx.globalAlpha=.65*(1-t);ctx.fillStyle='#fff3d8';ctx.fillRect(x,y,2,2);ctx.globalAlpha=1}ripples=ripples.filter(r=>now-r.t<2400);ripples.forEach(r=>{let age=(now-r.t)/2400;ctx.strokeStyle='#fff2f2';ctx.globalAlpha=1-age;ctx.lineWidth=1.5;ctx.beginPath();ctx.ellipse(r.x,r.y,5+age*20,3+age*12,0,0,Math.PI*2);ctx.stroke();if(r.heart){ctx.font='12px serif';ctx.fillText('♡',r.x-5,r.y-8)}ctx.globalAlpha=1})}
function frame(now){let dt=Math.min(2,Math.max(0,(now-last)/1000));last=now;if(dt){let gain=income()*dt;s.money+=gain;s.total+=gain;hud();if(now-loopCount>5000){save();loopCount=now}if(Date.now()-s.encounter>90000&&Math.random()<dt/100)predator()}draw(now);requestAnimationFrame(frame)}
function init(){canvas=$('water');ctx=canvas.getContext('2d',{alpha:false});load();hud();document.querySelectorAll('[data-menu]').forEach(b=>b.addEventListener('click',()=>open(b.dataset.menu)));$('settings').addEventListener('click',()=>open('settings'));$('close').addEventListener('click',close);$('backdrop').addEventListener('click',e=>{if(e.target===$('backdrop'))close()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&opened)close()});$('content').addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(b)action(b.dataset.action)});$('content').addEventListener('change',e=>{if(e.target.id==='duck-select'){selected=e.target.value;render()}if(e.target.matches('[data-slot]')&&e.target.value)equip(e.target.dataset.duck,e.target.dataset.slot,e.target.value)});$('love').addEventListener('click',()=>{let r=canvas.getBoundingClientRect();tap({clientX:r.left+r.width/2,clientY:r.top+r.height/2})});canvas.addEventListener('pointerdown',tap);window.addEventListener('resize',()=>draw(performance.now()));window.addEventListener('pagehide',save);document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});last=performance.now();requestAnimationFrame(frame);setInterval(()=>{if(!opened&&Date.now()-s.encounter>90000&&Math.random()<.28)predator()},12000)}
init();
})();
</script></body></html>
