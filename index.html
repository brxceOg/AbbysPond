const attackRanges={Common:[1,10],Uncommon:[10,20],Rare:[20,35],Epic:[35,50],Legendary:[50,70],Mythic:[70,100]};
function duckMaxHealth(d){const v=def(d);return Math.max(1,Math.round(v.h+(Math.max(1,Number(d.level)||1)-1)*4+Object.values(d.equipment||{}).reduce((n,id)=>n+(item(id)?item(id).h:0),0)))}
function duckAttack(d){const v=def(d);return Math.max(1,Math.round((Number(d.attackStat)||attackRanges[v.r][0])+((Math.max(1,Number(d.level)||1)-1)*2)+Object.values(d.equipment||{}).reduce((n,id)=>n+(item(id)?item(id).a:0),0)))}
function ensureDuckCombat(d){const range=attackRanges[def(d).r]||attackRanges.Common;if(!Number.isFinite(Number(d.attackStat))||Number(d.attackStat)<1)d.attackStat=Math.floor(Math.random()*(range[1]-range[0]+1))+range[0];const max=duckMaxHealth(d);if(!Number.isFinite(Number(d.health)))d.health=max;d.health=Math.max(0,Math.min(max,Number(d.health)));d.maxHealth=max;if(d.health<=0)d.injured=true;return d}
function healDuck(d,amount){ensureDuckCombat(d);const before=d.health;d.health=Math.min(d.maxHealth,d.health+amount);if(d.health>0)d.injured=false;return d.health-before}

const def=d=>ducks.find(x=>x.id===d.species)||ducks[0],item=id=>items.find(x=>x.id===id),fmt=n=>n>=1e6?(n/1e6).toFixed(1)+'m':n>=1e3?(n/1e3).toFixed(1)+'k':(n<10&&n%1?n.toFixed(1):Math.floor(n)).toLocaleString('en-US'),dur=n=>n>=3600?Math.floor(n/3600)+'h '+Math.floor(n%3600/60)+'m':Math.max(1,Math.floor(n/60))+' minutes';
function incomeDuck(d){let bonus=0;Object.values(d.equipment||{}).forEach(id=>{if(item(id))bonus+=item(id).i});return def(d).i*(1+(d.level-1)*.22)*(1+s.up.income*.12)*(1+bonus)}
function income(){return s.ducks.reduce((a,d)=>a+incomeDuck(d),0)}
function power(){return s.ducks.reduce((a,d)=>a+def(d).a+(d.level-1)*2+Object.values(d.equipment||{}).reduce((v,id)=>v+(item(id)?item(id).a+item(id).h*.15:0),0),0)+s.up.defense*1.5}
function cost(k){return Math.floor(({income:35,luck:55,defense:45,roll:70,offline:80})[k]*Math.pow(k==='luck'?1.78:1.62,s.up[k]))}
function rollCost(){return Math.max(1,Math.floor(35*Math.pow(1.13,s.rolls)*(1-s.up.roll*.025)))}
function weights(){let w={...base};['Uncommon','Rare','Epic','Legendary','Mythic'].forEach(r=>w[r]*=1+s.up.luck*.18);let total=Object.values(w).reduce((a,b)=>a+b,0);return Object.fromEntries(rarities.map(r=>[r,w[r]/total]))}
function save(){s.saved=Date.now();try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){if(!storageWarningShown){storageWarningShown=true;queueEvent('Browser storage is unavailable; progress may not persist.');}}}
function load(){try{const raw=localStorage.getItem(KEY);if(!raw)return;const x=JSON.parse(raw);if(!x||x.version!==1||!Array.isArray(x.ducks))throw Error('bad save');s={...fresh(),...x};s.up={...fresh().up,...x.up};s.inv=x.inv&&typeof x.inv==='object'?x.inv:{};s.ducks=s.ducks.filter(d=>d&&ducks.some(v=>v.id===d.species));if(!s.ducks.length)s.ducks=fresh().ducks;s.ducks.forEach(ensureDuckCombat);s.found=[...new Set([...(Array.isArray(s.found)?s.found:[]),...s.ducks.map(d=>d.species)])].filter(id=>ducks.some(d=>d.id===id));s.money=Math.max(0,Number(s.money)||0);s.saved=Number(s.saved)||Date.now();s.encounter=Number(s.encounter)||Date.now();const away=Math.min(CAP,Math.max(0,(Date.now()-s.saved)/1000)),gain=income()*away*Math.min(.75,.5+s.up.offline*.05);if(gain>=1){s.money+=gain;s.total+=gain;setTimeout(()=>{open('upgrades');$('content').insertAdjacentHTML('afterbegin','<div class="offline"><strong>Welcome back, pond keeper ♡</strong><br>Your ducks gathered <strong>'+fmt(gain)+' pennies</strong> while you were away ('+dur(away)+').</div>')},500)}}catch(e){s=fresh();setTimeout(()=>say('A fresh pond is ready. Your old save could not be read.'),300)}}
function say(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(toastTime);toastTime=setTimeout(()=>$('toast').classList.remove('show'),2300)}
function queueEvent(message){const text=String(message||'').trim();if(!text)return;if((eventShowing&&text===currentEventMessage)||eventQueue[eventQueue.length-1]===text)return;eventQueue.push(text);if(!eventShowing)showNextEvent()}
function showNextEvent(){const el=$('event');if(!eventQueue.length){eventShowing=false;currentEventMessage='';return}eventShowing=true;currentEventMessage=eventQueue.shift();el.classList.remove('event-visible','event-fading');el.textContent=currentEventMessage;requestAnimationFrame(()=>{if(eventShowing&&el.textContent===currentEventMessage)el.classList.add('event-visible')});clearTimeout(eventTimer);eventTimer=setTimeout(()=>{el.classList.remove('event-visible');el.classList.add('event-fading');eventTimer=setTimeout(()=>{el.classList.remove('event-fading');el.textContent='';eventShowing=false;showNextEvent()},450)},3200)}

function rollMenu(c){header('A NEW LITTLE FRIEND','Find a duck');let w=weights();c.innerHTML='<p class="intro">Every duck in the pond has a place on the wheel. Take a breath, give it a spin, and see which little friend finds you. Your luck upgrades still determine the real odds.</p><div class="card"><div class="mtitle">Your collection journey</div><div class="track"><span style="width:'+s.found.length/ducks.length*100+'%"></span></div><div class="meta">'+s.found.length+' / '+ducks.length+' unique ducks discovered</div></div><div class="wheel-card"><div class="wheel-wrap"><canvas id="duck-wheel" role="img" aria-label="Prize wheel showing every possible duck; the pointer marks the result" width="640" height="640"></canvas></div><div class="wheel-result" id="wheel-result">'+(rolling?'The wheel is spinning…':wheelOutcome?wheelResultText(wheelOutcome):'Who will waddle into your pond next? ♡')+'</div><div style="margin-top:11px">'+btn(rolling?'Spinning…':(wheelOutcome?'Invite another duck · ':'Spin for a duck · ')+fmt(rollCost())+' pennies','roll',rolling||s.money<rollCost())+'</div><p class="wheel-note">The wheel’s slices reflect each duck’s actual chance. Luck upgrades change the odds; the animation never changes the result.</p></div><p class="section">CURRENT RARITY ODDS</p><div class="wheel-odds">'+rarities.map(r=>'<div class="setting"><span class="pill '+r+'">'+r+'</span><strong>'+(w[r]*100).toFixed(w[r]<.01?2:1)+'%</strong></div>').join('')+'</div><p class="intro" style="margin-top:12px">Luck level '+s.up.luck+' · familiar friends bring a keepsake petal and a few bonus pennies.</p>';drawWheelElement();}
function upgradeMenu(c){header('GROW AT YOUR OWN PACE','Pond upgrades');let defs=[['income','Bountiful pond','Every duck earns 12% more pennies per level.'],['luck','Lucky wildflowers','Improves the chance of rarer ducks by 18% per level.'],['defense','Brave little flock','Adds 1.5 flock power per level when visitors appear.'],['roll','Friendly invitations','Lowers duck invitation costs by 2.5% per level.'],['offline','Sleepytime savings','Improves offline earnings by 5% per level, up to 75%.']];c.innerHTML='<p class="intro">Small, thoughtful improvements make this pond lovelier over time. Every upgrade has a clear cost and lasting effect.</p><div class="list">'+defs.map(([k,t,d])=>card(t,d,'Level '+s.up[k]+' · Next cost: '+fmt(cost(k)),btn('Upgrade','up:'+k,s.money<cost(k)||s.up[k]>=50))).join('')+'</div>'}
function flockMenu(c){header('EVERY DUCK IS SPECIAL','Your flock');const injured=s.ducks.filter(x=>{ensureDuckCombat(x);return x.injured||x.health<=0});const tabs='<div class="flock-tabs" role="group" aria-label="Flock sections"><button class="flock-tab" data-action="flocktab:ducks" aria-pressed="'+(flockTab==='ducks')+'">Your ducks · '+s.ducks.length+'</button><button class="flock-tab" data-action="flocktab:injured" aria-pressed="'+(flockTab==='injured')+'">Injured ducks · '+injured.length+'</button></div>';if(flockTab==='injured'){c.innerHTML='<p class="intro">A little rest after a tough encounter. Injured ducks stay safely in your pond and can recover when they catch a bug.</p>'+tabs+(injured.length?'<div class="list">'+injured.map(x=>{const v=def(x);return '<article class="card injured-card"><div class="row"><div class="avatar">'+v.e+'</div><div class="main"><div class="mtitle">'+v.name+' <span class="pill '+v.r+'">'+v.r+'</span></div><div class="desc">'+v.desc+'</div><div class="meta">Needs a little recovery · '+Math.ceil(x.health)+' / '+duckMaxHealth(x)+' health</div></div>'+btn('Check on duck','selectduck:'+x.uid,false,true)+'</div><div class="track"><span style="width:0%;background:#d87970"></span></div></article>'}).join('')+'</div>':'<div class="empty"><strong>No ducks need extra care</strong>Your whole flock is feeling well. May it stay that way. ♡</div>');return}if(!selected||!s.ducks.some(x=>x.uid===selected))selected=s.ducks[0].uid;let d=s.ducks.find(x=>x.uid===selected),v=def(d),uc=Math.floor(20*Math.pow(1.65,d.level-1)*v.i);c.innerHTML=tabs+'<p class="intro">Choose a duck to see their strengths, improve their skills, and equip a keepsake.</p><label class="section" for="duck-select">CHOOSE YOUR DUCK</label><select class="select" id="duck-select">'+s.ducks.map(x=>'<option value="'+x.uid+'" '+(x.uid===d.uid?'selected':'')+'>'+def(x).name+(x.injured?' · recovering':'')+' · Lv '+x.level+'</option>').join('')+'</select><div class="card '+(d.injured?'injured-card':'')+'"><div class="row"><div class="avatar">'+v.e+'</div><div class="main"><div class="mtitle">'+v.name+' <span class="pill '+v.r+'">'+v.r+'</span>'+(d.injured?' <span class="pill">Injured</span>':'')+'</div><div class="desc">'+v.desc+'</div><div class="meta">Level '+d.level+' · '+fmt(incomeDuck(d))+' pennies/sec</div></div></div><div class="setting"><span>Attack</span><strong>'+duckAttack(d)+' damage</strong></div><div class="setting"><span>Health</span><strong>'+Math.ceil(ensureDuckCombat(d).health)+' / '+duckMaxHealth(d)+'</strong></div><div style="margin-top:12px">'+btn('Care for '+v.name+' · '+fmt(uc), 'duckup:'+d.uid,s.money<uc||d.level>=50)+'</div></div><p class="section">KEEPSAKE SLOTS</p><p class="intro">Swap keepsakes any time without losing them.</p>'+['Charm','Ribbon','Shell'].map(slot=>{let equipped=item(d.equipment[slot]),available=items.filter(x=>x.s===slot&&(s.inv[x.id]||0)>0);return '<div class="card"><div class="row"><div class="main"><div class="mtitle">'+slot+'</div><div class="desc">'+(equipped?equipped.e+' '+equipped.n+' · '+equipped.d:'Nothing tucked in here yet.')+'</div></div>'+(equipped?btn('Remove','off:'+d.uid+':'+slot,false,true):'')+'</div>'+(available.length&&!equipped?'<select class="select" data-slot="'+slot+'" data-duck="'+d.uid+'"><option value="">Choose a keepsake…</option>'+available.map(x=>'<option value="'+x.id+'">'+x.n+' · '+x.d+' ('+s.inv[x.id]+')</option>').join('')+'</select>':'')+'</div>'}).join('')}
function inventoryMenu(c){header('LITTLE TREASURES','Keepsakes');let got=items.filter(x=>(s.inv[x.id]||0)>0);c.innerHTML='<p class="intro">A little collection of useful things your pond has gathered. Equip keepsakes from a duck’s care menu.</p>'+(got.length?'<div class="list">'+got.map(x=>card(x.e+' '+x.n+' <span class="pill '+x.r+'">'+x.r+'</span>',x.d,x.s+' slot · Quantity '+s.inv[x.id],btn('Care for a duck','goto-flock',false,true))).join('')+'</div>':'<div class="empty"><strong>Nothing in the keepsake basket just yet</strong>Little treasures may appear after you protect the pond from visitors.</div>')+'<p class="section">DUCK COLLECTION</p><div class="list">'+ducks.map(d=>{let found=s.found.includes(d.id);return '<article class="card"><div class="row"><div class="avatar">'+(found?d.e:'?')+'</div><div class="main"><div class="mtitle">'+(found?d.name:'A mystery friend')+' <span class="pill '+d.r+'">'+d.r+'</span></div><div class="desc">'+(found?d.desc:'Not met yet. Keep inviting ducks and see who finds your pond.')+'</div></div></div></article>'}).join('')+'</div>'}
function settingsMenu(c){header('MAKE YOURSELF COMFORTABLE','Pond settings');c.innerHTML='<p class="intro">A few gentle options to keep your little pond feeling just right.</p><div class="setting"><span>Reduced motion</span>'+btn(s.motion?'On':'Off','motion',false,true)+'</div><div class="setting"><span>Save status</span><strong>Auto-save enabled</strong></div><div class="setting"><span>Offline earnings cap</span><strong>8 hours</strong></div><div class="card" style="margin-top:16px"><div class="mtitle">Start a fresh pond</div><div class="desc">This permanently clears this browser’s Abby’s Pond save.</div><div style="margin-top:11px">'+btn('Reset all progress','reset',false,true)+'</div></div>'}
function doRoll(){if(rolling)return;let price=rollCost();if(s.money<price)return say('A few more pennies first, sweet pea.');s.money-=price;s.rolls++;let w=weights(),n=Math.random(),r='Common';for(const key of rarities){n-=w[key];if(n<=0){r=key;break}}let pool=ducks.filter(d=>d.r===r),d=pool[Math.floor(Math.random()*pool.length)];rolling=true;wheelOutcome=null;save();hud();render();animateWheel(d,price)}
let rolling=false,wheelAngle=0,wheelOutcome=null,wheelFrame=0,flockTab='ducks';
const rarityColors={Common:'#d9d0c5',Uncommon:'#b8d0aa',Rare:'#a9d5dc',Epic:'#c6aed8',Legendary:'#f0cf7c',Mythic:'#e5a3bd'};
function wheelEntries(){let w=weights();return ducks.map(d=>({duck:d,p:w[d.r]/ducks.filter(x=>x.r===d.r).length})).sort((a,b)=>ducks.indexOf(a.duck)-ducks.indexOf(b.duck))}
function drawWheelElement(){const cv=$('duck-wheel');if(!cv)return;const size=640,dpr=Math.min(window.devicePixelRatio||1,2);cv.width=size*dpr;cv.height=size*dpr;const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,size,size);g.translate(size/2,size/2);g.rotate(wheelAngle);const R=292,entries=wheelEntries();let a=-Math.PI/2;g.beginPath();g.arc(0,0,R+7,0,Math.PI*2);g.fillStyle='#f5dfd2';g.fill();entries.forEach(({duck:d,p},idx)=>{let span=p*Math.PI*2,next=a+span;g.beginPath();g.moveTo(0,0);g.arc(0,0,R,a,next);g.closePath();g.fillStyle=rarityColors[d.r];g.fill();g.strokeStyle='#fff9f0';g.lineWidth=3;g.stroke();if(span>.16){let mid=(a+next)/2;g.save();g.rotate(mid);g.translate(R*.69,0);g.rotate(Math.PI/2);g.textAlign='center';g.textBaseline='middle';g.font='30px system-ui,Apple Color Emoji,Segoe UI Emoji';g.fillStyle='#514c4b';g.fillText(d.e,0,-4);if(span>.28){g.font='bold 11px Nunito,system-ui,sans-serif';g.fillText(d.name,0,16)}g.restore()}else{let mid=(a+next)/2;g.beginPath();g.arc(Math.cos(mid)*R*.91,Math.sin(mid)*R*.91,3,0,Math.PI*2);g.fillStyle='#fffaf4';g.fill()}a=next});g.beginPath();g.arc(0,0,51,0,Math.PI*2);g.fillStyle='#fff8ef';g.fill();g.lineWidth=7;g.strokeStyle='#b96f7d';g.stroke();g.textAlign='center';g.textBaseline='middle';g.font='bold 31px system-ui,sans-serif';g.fillStyle='#b96f7d';g.fillText('♡',0,2)}
function wheelResultText(out){return out.duplicate?'A familiar friend! '+out.duck.name+' sends you a keepsake petal and '+fmt(out.bonus)+' bonus pennies. ♡':'You found '+out.duck.name+'! '+out.duck.e+' A new little friend has joined your flock.'}
function animateWheel(winner,price){const entries=wheelEntries();let cursor=-Math.PI/2,center=0;for(const e of entries){const span=e.p*Math.PI*2;if(e.duck.id===winner.id){center=cursor+span/2;break}cursor+=span}const current=wheelAngle;let delta=((-Math.PI/2-center-current)%(Math.PI*2)+Math.PI*2)%(Math.PI*2);if(delta<.01)delta=Math.PI*2;const target=current+Math.PI*2*5+delta;const reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;const duration=reduced?650:4700,start=performance.now();cancelAnimationFrame(wheelFrame);function step(now){let t=Math.min(1,(now-start)/duration),ease=1-Math.pow(1-t,4);wheelAngle=current+(target-current)*ease;drawWheelElement();if(t<1){wheelFrame=requestAnimationFrame(step);return}wheelAngle=target%(Math.PI*2);drawWheelElement();const duplicate=s.found.includes(winner.id);let bonus=0;if(duplicate){s.inv['petal-token']=(s.inv['petal-token']||0)+1;bonus=Math.max(2,Math.floor(price*.15));s.money+=bonus;say('A familiar friend visited! A petal and a few pennies for you.')}else{s.found.push(winner.id);s.ducks.push({uid:'duck-'+s.nextUid++,species:winner.id,level:1,equipment:{}});say(winner.name+' found your pond! Welcome, little one.');queueEvent(winner.name+' has joined your little flock.')}wheelOutcome={duck:winner,duplicate,bonus};rolling=false;hud();save();render()}wheelFrame=requestAnimationFrame(step)}
function buy(k){let price=cost(k);if(s.money<price||s.up[k]>=50)return;s.money-=price;s.up[k]++;say('Your pond feels a little lovelier already.');hud();save();render()}
function care(uid){let d=s.ducks.find(x=>x.uid===uid),price=Math.floor(20*Math.pow(1.65,d.level-1)*def(d).i);if(!d||s.money<price||d.level>=50)return;s.money-=price;const oldMax=duckMaxHealth(d);d.level++;ensureDuckCombat(d);d.health=Math.min(d.maxHealth,d.health+(d.maxHealth-oldMax));say(def(d).name+' grew a little braver!');hud();save();render()}
