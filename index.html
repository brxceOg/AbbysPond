let s=fresh(),canvas,ctx,last=Date.now(),selected=null,menu=null,opened=false,rolling=false,lureOutcome=null,flockTab='ducks',scratchChoiceIndex=null,duckPositions=[],ripples=[],impactClouds=[],confetti=[],flockCheerAt=0,victoryBanner=null,toastTime=0,eventTimer=0,eventQueue=[],eventShowing=false,currentEventMessage='',storageWarningShown=false,loopCount=0,encounterAnim=null,duckAvoidance={},duckFormation={name:'circle',nextSwitch:0,fromGap:null,toGap:null,transitionAt:0,fromZigzag:0,toZigzag:0,leaderAngle:0};

const attackRanges={Common:[1,10],Uncommon:[10,20],Rare:[20,35],Epic:[35,50],Legendary:[50,70],Mythic:[70,100]};
function duckMaxHealth(d){const v=def(d);return Math.max(1,Math.round(v.h+(Math.max(1,Number(d.level)||1)-1)*4+Object.values(d.equipment||{}).reduce((n,id)=>n+(item(id)?item(id).h:0),0)))}
function duckAttack(d){const v=def(d);return Math.max(1,Math.round((Number(d.attackStat)||attackRanges[v.r][0])+((Math.max(1,Number(d.level)||1)-1)*2)+Object.values(d.equipment||{}).reduce((n,id)=>n+(item(id)?item(id).a:0),0)))}
function ensureDuckCombat(d){const range=attackRanges[def(d).r]||attackRanges.Common;if(!Number.isFinite(Number(d.attackStat))||Number(d.attackStat)<1)d.attackStat=Math.floor(Math.random()*(range[1]-range[0]+1))+range[0];const max=duckMaxHealth(d);if(!Number.isFinite(Number(d.health)))d.health=max;d.health=Math.max(0,Math.min(max,Number(d.health)));d.maxHealth=max;if(d.health<=0)d.injured=true;return d}
function healDuck(d,amount){ensureDuckCombat(d);const before=d.health;d.health=Math.min(d.maxHealth,d.health+amount);if(d.health>0)d.injured=false;return d.health-before}

const def=d=>ducks.find(x=>x.id===d.species)||ducks[0],item=id=>items.find(x=>x.id===id),fmt=n=>n>=1e6?(n/1e6).toFixed(1)+'m':n>=1e3?(n/1e3).toFixed(1)+'k':(n<10&&n%1?n.toFixed(1):Math.floor(n)).toLocaleString('en-US'),dur=n=>n>=3600?Math.floor(n/3600)+'h '+Math.floor(n%3600/60)+'m':Math.max(1,Math.floor(n/60))+' minutes';
function duckIcon(d,cls=''){
 const id=d&&d.id||d&&d.species||'meadow',v=ducks.find(x=>x.id===id)||ducks[0];
 const shapes={

 };
 const p=shapes[id]||shapes.meadow;let details='';
 if(id==='clover')details='<path d="M26 24c-3-5-8-2-5 1-4-1-5 4-1 5 1 4 5 2 5-1 3 3 7 0 4-3 1-4-3-5-3-2Z" fill="#6f9c68" stroke="#527b59" stroke-width=".6"/>';

 if(id==='peaches')details='<circle cx="31" cy="23" r="2.2" fill="#f6c0a8" opacity=".95"/>';

 if(id==='heartsong')details='<path d="M28 22c-2-3-5 0 0 4 5-4 2-7 0-4Z" fill="#d77998"/>';

 return '<svg class="duck-sprite-icon '+cls+'" viewBox="0 0 56 40" role="img" aria-label="'+v.name+'" xmlns="http://www.w3.org/2000/svg"><ellipse cx="28" cy="34" rx="20" ry="2.5" fill="#426b66" opacity=".15"/><path d="'+p.tail+'" fill="'+v.c+'" stroke="#75594b" stroke-width=".8" stroke-linejoin="round"/><ellipse cx="'+(24+p.body*.18)+'" cy="26" rx="'+p.body+'" ry="7.3" fill="'+v.c+'" stroke="#75594b" stroke-width=".9"/><path d="M17 28 Q26 32 37 27" fill="none" stroke="'+v.b+'" stroke-width="1.3" opacity=".9"/><path d="'+p.wing+'" fill="'+v.b+'" stroke="#75594b" stroke-width=".75" stroke-linejoin="round"/>'+details+'<circle cx="43" cy="13.2" r="'+p.head+'" fill="'+v.c+'" stroke="#75594b" stroke-width=".8"/><circle cx="45" cy="12.3" r="1.15" fill="#493f39"/><circle cx="45.35" cy="11.95" r=".35" fill="#fffdf3"/><path d="M48 15.2l6 1.4-5.7 2.1-1.4-1.1Z" fill="#d99465" stroke="#91664f" stroke-width=".55" stroke-linejoin="round"/></svg>';
}

function incomeDuck(d){let bonus=0;Object.values(d.equipment||{}).forEach(id=>{if(item(id))bonus+=item(id).i});return def(d).i*(1+(d.level-1)*.22)*(1+s.up.income*.12)*(1+bonus)}
function income(){return s.ducks.reduce((a,d)=>a+incomeDuck(d),0)}
function power(){return s.ducks.reduce((a,d)=>a+def(d).a+(d.level-1)*2+Object.values(d.equipment||{}).reduce((v,id)=>v+(item(id)?item(id).a+item(id).h*.15:0),0),0)+s.up.defense*1.5}
function cost(k){return Math.floor(({income:35,luck:55,defense:45,roll:70,offline:80})[k]*Math.pow(k==='luck'?1.78:1.62,s.up[k]))}
function rollCost(){return Math.max(1,Math.floor(35*Math.pow(1.13,s.rolls)*(1-s.up.roll*.025)))}
function rollPrice(count){let total=0;for(let i=0;i<count;i++)total+=Math.max(1,Math.floor(35*Math.pow(1.13,s.rolls+i)*(1-s.up.roll*.025)));return total}
function weights(){let w={...base};['Uncommon','Rare','Epic','Legendary','Mythic'].forEach(r=>w[r]*=1+s.up.luck*.18);let total=Object.values(w).reduce((a,b)=>a+b,0);return Object.fromEntries(rarities.map(r=>[r,w[r]/total]))}
function save(){s.saved=Date.now();try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){if(!storageWarningShown){storageWarningShown=true;queueEvent('Browser storage is unavailable; progress may not persist.');}}}
function load(){try{const raw=localStorage.getItem(KEY);if(!raw)return;const x=JSON.parse(raw);if(!x||x.version!==1||!Array.isArray(x.ducks))throw Error('bad save');s={...fresh(),...x};s.up={...fresh().up,...x.up};s.inv=x.inv&&typeof x.inv==='object'?x.inv:{};s.ducks=s.ducks.filter(d=>d&&ducks.some(v=>v.id===d.species));if(!s.ducks.length)s.ducks=fresh().ducks;s.ducks.forEach(ensureDuckCombat);s.found=[...new Set([...(Array.isArray(s.found)?s.found:[]),...s.ducks.map(d=>d.species)])].filter(id=>ducks.some(d=>d.id===id));s.money=Math.max(0,Number(s.money)||0);s.saved=Number(s.saved)||Date.now();s.encounter=Number(s.encounter)||Date.now();const away=Math.min(CAP,Math.max(0,(Date.now()-s.saved)/1000)),gain=income()*away*Math.min(.75,.5+s.up.offline*.05);if(gain>=1){s.money+=gain;s.total+=gain;setTimeout(()=>{open('upgrades');$('content').insertAdjacentHTML('afterbegin','<div class="offline"><strong>Welcome back, pond keeper ♡</strong><br>Your ducks gathered <strong>'+fmt(gain)+' pennies</strong> while you were away ('+dur(away)+').</div>')},500)}}catch(e){s=fresh();setTimeout(()=>say('A fresh pond is ready. Your old save could not be read.'),300)}}
function say(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(toastTime);toastTime=setTimeout(()=>$('toast').classList.remove('show'),2300)}
function queueEvent(message){const text=String(message||'').trim();if(!text)return;if((eventShowing&&text===currentEventMessage)||eventQueue[eventQueue.length-1]===text)return;eventQueue.push(text);if(!eventShowing)showNextEvent()}
function showNextEvent(){const el=$('event');if(!eventQueue.length){eventShowing=false;currentEventMessage='';return}eventShowing=true;currentEventMessage=eventQueue.shift();el.classList.remove('event-visible','event-fading');el.textContent=currentEventMessage;requestAnimationFrame(()=>{if(eventShowing&&el.textContent===currentEventMessage)el.classList.add('event-visible')});clearTimeout(eventTimer);eventTimer=setTimeout(()=>{el.classList.remove('event-visible');el.classList.add('event-fading');eventTimer=setTimeout(()=>{el.classList.remove('event-fading');el.textContent='';eventShowing=false;showNextEvent()},450)},3200)}
function hud(){$('money').textContent=fmt(s.money);$('income').textContent='+'+fmt(income())+' / sec';$('count').textContent=s.ducks.length+' duck'+(s.ducks.length===1?'':'s');$('collection').textContent=s.found.length+' of '+ducks.length+' found'}
function header(a,b){$('kicker').textContent=a;$('title').textContent=b}
function btn(label,action,disabled=false,secondary=false){return '<button class="'+(secondary?'secondary':'primary')+'" data-action="'+action+'" '+(disabled?'disabled':'')+'>'+label+'</button>'}
function card(title,desc,meta,button,extra=''){return '<article class="card"><div class="row"><div class="main"><div class="mtitle">'+title+'</div><div class="desc">'+desc+'</div><div class="meta">'+meta+'</div>'+extra+'</div>'+button+'</div></article>'}
function open(k){if(rolling&&k!=='roll')return;if(k==='roll'&&!rolling){scratchChoiceIndex=null;lureOutcome=null}menu=k;opened=true;const backdrop=$('backdrop');backdrop.classList.remove('journal-closing');backdrop.hidden=false;render();$('close').disabled=rolling;$('close').focus()}
function close(){if(rolling||!opened)return;opened=false;menu=null;const backdrop=$('backdrop');backdrop.classList.add('journal-closing');setTimeout(()=>{if(!opened){backdrop.hidden=true;backdrop.classList.remove('journal-closing')}},190)}
function render(){const c=$('content');c.innerHTML='';const modalEl=document.querySelector('.modal');if(modalEl)modalEl.dataset.theme=({roll:'meadow',upgrades:'botanical',flock:'field-guide',inventory:'scrapbook',settings:'journal'}[menu]||'journal');if(menu==='roll')rollMenu(c);if(menu==='upgrades')upgradeMenu(c);if(menu==='flock')flockMenu(c);if(menu==='inventory')inventoryMenu(c);if(menu==='settings')settingsMenu(c)}

function startScratch(index){
  if(rolling||scratchChoiceIndex!==null||!Number.isInteger(index)||index<0||index>2)return;
  const count=[1,3,6][index],price=rollPrice(count);
  if(s.money<price)return say('This sticker needs '+fmt(price)+' Pond Pennies, sweet pea.');
  const perRollPrices=Array.from({length:count},(_,i)=>Math.max(1,Math.floor(35*Math.pow(1.13,s.rolls+i)*(1-s.up.roll*.025))));
  s.money-=price;s.rolls+=count;
  const outcomes=[];
  for(let i=0;i<count;i++){
    let outcome;
    if(Math.random()<.10){outcome=Math.random()<.5?{type:'petal'}:{type:'pennies',bonus:Math.max(2,Math.floor(perRollPrices[i]*(.25+Math.random()*.25)))}}
    else{const w=weights();let n=Math.random(),r='Common';for(const key of rarities){n-=w[key];if(n<=0){r=key;break}}const pool=ducks.filter(d=>d.r===r),d=pool[Math.floor(Math.random()*pool.length)];outcome={type:'duck',duck:d}}
    outcomes.push(outcome);
  }
  rolling=true;scratchChoiceIndex=index;lureOutcome=null;save();hud();
  const panel=document.querySelector('.scratch-panel[data-action="scratch:'+index+'"]'),status=$('scratch-status');
  if(panel){panel.classList.add('is-scratching');panel.disabled=true}
  document.querySelectorAll('.scratch-panel').forEach((el,i)=>{if(i!==index){el.classList.add('is-locked');el.disabled=true}});
  if(status)status.textContent='Peeling '+count+' little '+(count===1?'sticker':'stickers')+'…';
  const reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let spinTimer=null;
  const beginShuffle=()=>{
    if(panel&&!reduced){
      const stage=document.createElement('span');stage.className='scratch-spin-stage';stage.setAttribute('aria-hidden','true');
      stage.innerHTML='<span class="spin-duck">'+duckIcon(ducks[0])+'</span><span class="spin-name">'+count+' mystery '+(count===1?'visitor':'visitors')+'…</span>';
      panel.appendChild(stage);panel.classList.add('is-spinning');
      if(status)status.textContent='Tiny footprints are appearing… who could they be?';
      let tick=0;const spinPool=ducks.slice();
      spinTimer=window.setInterval(()=>{
        const pick=spinPool[Math.floor(Math.random()*spinPool.length)];
        stage.innerHTML='<span class="spin-duck" style="--spin-color:'+pick.c+';--spin-belly:'+pick.b+'">'+duckIcon(pick)+'</span><span class="spin-name">'+pick.name+'</span>';
        stage.classList.remove('spin-pop');void stage.offsetWidth;stage.classList.add('spin-pop');tick++;
        if(tick>=10){
          window.clearInterval(spinTimer);spinTimer=null;const first=outcomes[0];
          if(first.type==='duck')stage.innerHTML='<span class="spin-duck winner-duck" style="--spin-color:'+first.duck.c+';--spin-belly:'+first.duck.b+'">'+duckIcon(first.duck)+'</span><span class="spin-name">'+(count===1?first.duck.name:count+' little discoveries!')+'</span>';
          else stage.innerHTML='<span class="spin-duck winner-duck">'+(first.type==='petal'?'🌸':'🪙')+'</span><span class="spin-name">'+(count===1?(first.type==='petal'?'Keepsake Petal':'Pond Pennies'):count+' little discoveries!')+'</span>';
          stage.classList.add('spin-landed');if(status)status.textContent=count===1?'The footprints have stopped… a little visitor has been found!':count+' rolls are ready to reveal their little surprises!';
        }
      },75);
    }
  };
  if(reduced){window.setTimeout(()=>finishLure(outcomes,perRollPrices),80);return;}
  window.setTimeout(beginShuffle,540);
  window.setTimeout(()=>{if(spinTimer!==null)window.clearInterval(spinTimer);finishLure(outcomes,perRollPrices)},1680);
}
function finishLure(outcomes,prices){
  const results=[];
  outcomes.forEach((outcome,i)=>{
    const price=prices[i];
    if(outcome.type==='duck'){
      const winner=outcome.duck,duplicate=s.found.includes(winner.id);let bonus=0;
      if(duplicate){s.inv['petal-token']=(s.inv['petal-token']||0)+1;bonus=Math.max(2,Math.floor(price*.15));s.money+=bonus}
      else{s.found.push(winner.id);s.ducks.push({uid:'duck-'+s.nextUid++,species:winner.id,level:1,equipment:{}})}
      results.push({type:'duck',duck:winner,duplicate,bonus});
    }else if(outcome.type==='petal'){s.inv['petal-token']=(s.inv['petal-token']||0)+1;results.push(outcome)}
    else{s.money+=outcome.bonus;results.push(outcome)}
  });
  if(results.length===1){
    const result=results[0];lureOutcome=result;
    if(result.type==='duck')say(result.duplicate?'A familiar friend visited! A petal and a few pennies for you.':result.duck.name+' found your pond! Welcome, little one.');
    else if(result.type==='petal')say('A little Keepsake Petal was hiding in the grass. ♡');
    else say('A tiny pouch of Pond Pennies! +'+fmt(result.bonus)+' ♡');
    if(result.type==='duck'&&!result.duplicate)queueEvent(result.duck.name+' has joined your little flock.');
  }else{
    lureOutcome={type:'batch',outcomes:results,count:results.length};
    const newFriends=results.filter(r=>r.type==='duck'&&!r.duplicate).length,treasures=results.filter(r=>r.type==='petal').length;
    say(results.length+' rolls opened! '+newFriends+' new '+(newFriends===1?'friend':'friends')+', '+treasures+' Keepsake '+(treasures===1?'Petal':'Petals')+'.');
    if(newFriends)queueEvent(newFriends+' new '+(newFriends===1?'duck has':'ducks have')+' joined your little flock.');
  }
  rolling=false;save();hud();render();
}

 // Small, localized confetti celebrates a victory around the flock, then settles away.

}


/* Each paper gets its own lightly irregular tear profile and one tiny hand-inked margin drawing. */
function applyStorybookCraft(root=document){
 const paperSelectors='.mhead,.card,.wheel-card,.offline,.empty,.wheel-result,.flock-tab';
 const doodles=[
  '<svg viewBox="0 0 48 38" aria-hidden="true"><g fill="none" stroke="#788b65" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 31Q21 22 28 5"/><path d="M13 26Q3 18 5 12Q14 14 16 22"/><path d="M19 18Q18 9 25 7Q28 14 21 20"/><path d="M25 10Q32 2 39 7Q36 15 27 14"/><path d="M8 31l-2 3"/></g><circle cx="38" cy="26" r="2" fill="#d49a9c"/></svg>',
  '<svg viewBox="0 0 48 38" aria-hidden="true"><g fill="none" stroke="#98745e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 28Q12 12 26 12Q35 12 36 20Q37 27 28 29L14 29Q8 29 7 28Z" fill="#e7c778"/><path d="M13 15Q17 7 25 10"/><circle cx="29" cy="18" r="1.2" fill="#59463e" stroke="none"/><path d="M35 21l6 2-6 2"/><path d="M10 31q3 2 6 0"/></g><path d="M3 8l3 3m3-6 1 4" stroke="#c98b91" stroke-width="1.5" stroke-linecap="round"/></svg>',
  '<svg viewBox="0 0 48 38" aria-hidden="true"><g fill="none" stroke="#6f948b" stroke-width="1.6" stroke-linecap="round"><path d="M5 15q7-5 14 0t14 0t10 0"/><path d="M4 22q8-5 16 0t16 0t7 0"/><path d="M11 29q6-4 12 0t12 0"/></g><path d="M31 5l1.5 4L37 11l-4.5 1.5L31 17l-1.5-4.5L25 11l4.5-2z" fill="#d7b96f"/></svg>',
  '<svg viewBox="0 0 48 38" aria-hidden="true"><g fill="none" stroke="#7e946b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 31Q21 22 21 6"/><path d="M13 25Q5 24 5 17Q13 16 16 22"/><path d="M19 17Q28 15 29 8Q21 7 19 17"/><path d="M22 26Q31 18 38 23Q34 31 22 26Z" fill="#c3d4aa"/></g><circle cx="36" cy="8" r="3" fill="#e4b1b4"/><circle cx="36" cy="8" r="1" fill="#f8e8c4"/></svg>'
 ];
 let serial=0;
 function polygonFor(el){
  let n=Array.from((el.className?.baseVal||el.className||'')+'-'+(el.id||'')+'-'+serial++).reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,173);
  const rand=()=>{n=(n*1664525+1013904223)>>>0;return n/4294967296};
  const pts=[];
  for(let i=0;i<=10;i++){const x=i*10,y=(i===0||i===10?6:3+rand()*4);pts.push([Math.max(1,Math.min(99,x+(i===0?2:i===10?-2:0))),y]);}
  for(let i=1;i<=5;i++){pts.push([96+rand()*2,i*16]);}
  for(let i=0;i<=10;i++){const x=100-i*10,y=(i===0||i===10?93:91+rand()*5);pts.push([x,y]);}
  for(let i=1;i<=5;i++){pts.push([3+rand()*3,100-i*16]);}
  return 'polygon('+pts.map(p=>p.map(v=>v.toFixed(1)+'%').join(' ')).join(',')+')';
 }
 function decorate(el){
  if(el.dataset.storyCrafted==='yes')return;
  el.dataset.storyCrafted='yes';
  if(el.matches(paperSelectors))el.style.setProperty('--paper-clip',polygonFor(el));
  // Keep modal surfaces clean and journal-like; no repeated stock corner doodles.
  el.querySelectorAll(':scope > .margin-doodle').forEach(node=>node.remove());
 }
 function scan(node){
  if(node.nodeType!==1)return;
  if(node.matches(paperSelectors))decorate(node);
  node.querySelectorAll?.(paperSelectors).forEach(decorate);
 }
 scan(root.documentElement||root);
 const content=document.getElementById('content');
 if(content&&!content.dataset.storyObserver){
  content.dataset.storyObserver='yes';
  const observer=new MutationObserver(records=>records.forEach(rec=>rec.addedNodes.forEach(scan)));
  observer.observe(content,{childList:true,subtree:true});
 }
}

applyStorybookCraft();
init();
})();
